<title>Finanças e Economia Gerencial</title><style id="estilo">/* Layout: uma coluna de leitura; navegação em caixas com a informação à vista; uma única cor de ação. */
:root {
  /* Cor: verde escuro, o padrão do site. Texto claro sobre fundo escuro, com a faixa de abertura num verde mais vivo. */
  --fundo: #111613; --papel: #1a221d; --tinta: #e8eee9; --suave: #9aa8a0; --linha: #2a342e;
  --verde: #86c9ab; --sobre-verde: #111613; --erro: #f0a27c;
  --palco: #0b0f0d; --sobre-palco: #f4f7f5; --sombra: rgba(0, 0, 0, .65);
  --faixa: #0f2e23; --sobre-faixa: #f4f7f1; --faixa-suave: #a9c7b8;
  --ouro: #e3b55a; --ouro-claro: #e9bf6b; --ouro-fundo: #2a2415;

  /* Tipo: cinco tamanhos, com razão de cerca de 1,25 entre eles, mais um para leitura longa. */
  --serifa: 'Literata', Georgia, 'Times New Roman', serif;
  --sans: 'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --t-meta: .875rem;
  --t-corpo: 1.0625rem;
  --t-leitura: 1.125rem;
  --t-titulo: 1.3125rem;
  --t-secao: 1.6875rem;
  --t-pagina: clamp(2rem, 1.45rem + 2.6vw, 2.75rem);
  /* Texto claro em fundo escuro pede um pouco mais de ar entre as linhas. */
  --entrelinha: 1.62;

  /* Espaço: escala de 4 pt. */
  --e1: 4px; --e2: 8px; --e3: 12px; --e4: 16px; --e5: 24px; --e6: 32px; --e7: 48px;
  --margem: clamp(16px, 5vw, 40px);
  --largura: 44rem;
  --toque: 2.75rem;

  /* Forma e movimento */
  --raio: 10px; --raio-p: 6px;
  --rapido: .16s; --saida: cubic-bezier(.25, 1, .5, 1);
  /* Um tema só: as mesmas cores em qualquer computador, esteja o sistema no modo claro ou escuro. */
  color-scheme: dark;
}

/* Base */
* { box-sizing: border-box; }
body { background: var(--fundo); color: var(--tinta); font: 400 var(--t-corpo)/var(--entrelinha) var(--sans); -webkit-text-size-adjust: 100%; }
h1, h2, h3, p, ul, ol, fieldset { margin: 0; padding: 0; }
h1, h2, h3 { overflow-wrap: break-word; }
ul, ol { list-style: none; }
fieldset { border: 0; min-width: 0; }
a { color: var(--verde); text-decoration-thickness: 1px; text-underline-offset: .2em; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--verde); outline-offset: 3px; }
main:focus { outline: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Tipografia */
h1 { font: 400 var(--t-pagina)/1.1 var(--serifa); letter-spacing: -.012em; text-wrap: balance; }
h2 { font: 500 var(--t-secao)/1.2 var(--serifa); letter-spacing: -.005em; text-wrap: balance; }
h3 { font: 500 var(--t-leitura)/1.35 var(--serifa); }
.eye { font: 600 var(--t-meta)/1.4 var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--verde); }
.eye a { text-decoration: none; }
.eye a:hover { text-decoration: underline; }
.lead { font: 400 var(--t-titulo)/1.4 var(--serifa); color: var(--suave); text-wrap: pretty; }
.suave, small { color: var(--suave); }
small { font-size: var(--t-meta); }
/* overflow-wrap: um endereço longo no meio do texto quebra em vez de alargar a página. */
.prosa { display: grid; gap: 1em; font: 400 var(--t-leitura)/1.65 var(--serifa); text-wrap: pretty; overflow-wrap: anywhere; }
.prosa > * { min-width: 0; }

/* Moldura */
.topo { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--e3) var(--e5); padding: var(--e4) var(--margem); border-bottom: 1px solid var(--linha); }
.marca { display: inline-flex; align-items: center; min-height: var(--toque); font: 500 var(--t-leitura)/1.2 var(--serifa); color: var(--tinta); text-decoration: none; }
/* Menu em caixas: alvos grandes para o dedo, e a seção atual preenchida. */
.topo nav { display: flex; flex-wrap: wrap; gap: var(--e2); }
.topo nav a { display: inline-flex; align-items: center; min-height: var(--toque); padding: 0 var(--e4); border: 1px solid var(--linha); border-radius: var(--raio); color: var(--tinta); text-decoration: none; transition: border-color var(--rapido) var(--saida), background-color var(--rapido) var(--saida); }
.topo nav a:hover { border-color: var(--verde); background: var(--papel); }
.topo nav a[aria-current] { background: var(--tinta); border-color: var(--tinta); color: var(--fundo); }
.col { max-width: calc(var(--largura) + 2 * var(--margem)); margin-inline: auto; padding-inline: var(--margem); padding-block: clamp(var(--e5), 6vw, var(--e7)); display: grid; gap: var(--e5); }
.col > * { min-width: 0; }
.col.larga { max-width: calc(62rem + 2 * var(--margem)); gap: var(--e6); }
.col.larga section { gap: var(--e4); }
.col section { display: grid; gap: var(--e3); }
.rodape { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--e2) var(--e5); padding: var(--e5) var(--margem); border-top: 1px solid var(--linha); font-size: var(--t-meta); color: var(--suave); }

/* Caixas de navegação: a área inteira é clicável e a informação principal fica à vista. */
/* 13,5rem de mínimo: no desktop cabem quatro por linha, e as quatro disciplinas da graduação não deixam uma sozinha embaixo. */
.caixas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 13.5rem), 1fr)); gap: var(--e3); }
.caixas.compactas { grid-template-columns: repeat(auto-fill, minmax(min(100%, 12.5rem), 1fr)); }
.caixas.uma { grid-template-columns: 1fr; }
/* Índice de módulos: quatro por linha no desktop e dois no celular, para a disciplina inteira caber à vista. */
.caixas.indice { grid-template-columns: repeat(auto-fill, minmax(min(100%, 9.5rem), 1fr)); }
.caixas.indice .caixa { padding: var(--e3); }
/* Palavra longa numa caixa estreita quebra com hífen ("Desenvolvi-mento"), e não no meio da sílaba. */
/* Só palavras de 12 letras ou mais levam hífen; sem isso, "Avaliação" era partida mesmo cabendo na linha. */
.caixas.compactas.indice .caixa-titulo { font-size: var(--t-corpo); text-wrap: wrap; overflow-wrap: break-word; hyphens: auto; hyphenate-limit-chars: 12 5 5; }
.caixa { display: flex; flex-direction: column; gap: var(--e1); width: 100%; height: 100%; min-height: 3.5rem; padding: var(--e4); border: 1px solid var(--linha); border-radius: var(--raio); background: var(--fundo); color: var(--tinta); font: inherit; text-align: left; text-decoration: none; transition: border-color var(--rapido) var(--saida), background-color var(--rapido) var(--saida), transform var(--rapido) var(--saida); }
.caixa:hover { border-color: var(--verde); background: var(--papel); }
.caixa:active { transform: scale(.985); }
.caixa:hover { transform: translateY(-2px); }
.caixa:active { transform: scale(.985); }
.caixa-corpo { display: flex; flex-direction: column; gap: var(--e1); flex: 1; min-width: 0; }
.caixa-titulo { font: 500 var(--t-titulo)/1.25 var(--serifa); text-wrap: balance; overflow-wrap: break-word; }
.caixas.compactas .caixa-titulo { font-size: var(--t-leitura); }
.caixa-info { font-size: var(--t-meta); color: var(--suave); }
.caixa-texto { color: var(--suave); text-wrap: pretty; }
.caixa-destaque { align-self: flex-start; padding: 0 var(--e2); border-radius: 999px; background: var(--ouro-fundo); color: var(--ouro); font-size: var(--t-meta); font-weight: 600; }
.caixa-acao { margin-top: auto; padding-top: var(--e2); font-size: var(--t-meta); font-weight: 600; color: var(--verde); }
/* Aviso: fundo tingido em vez de borda, para se destacar das caixas de navegação. */
.caixa-aviso { background: var(--ouro-fundo); border-color: var(--ouro-fundo); }
.caixa-aviso .caixa-info { color: var(--ouro); font-weight: 600; }
.caixa-aviso:hover { background: var(--ouro-fundo); border-color: var(--ouro); }
/* Ícone do tipo de material: nos botões, ao lado do nome; nas caixas, no topo. */
.ic { flex: none; width: 1.125rem; height: 1.125rem; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.caixa-material .ic { width: 1.75rem; height: 1.75rem; margin-bottom: var(--e1); color: var(--verde); }
/* Título de seção do Início: grande, com a contagem ao lado. */
.secao { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--e1) var(--e3); font: 500 var(--t-secao)/1.2 var(--serifa); letter-spacing: -.005em; }
.secao small { font: 400 var(--t-meta) var(--sans); letter-spacing: 0; }
/* As caixas sobem alguns pixels ao aparecer, uma depois da outra. Só posição: o conteúdo nunca fica invisível. */
@keyframes subir { from { transform: translateY(12px); } }
.caixas > li { animation: subir .5s var(--saida) backwards; }
.caixas > li:nth-child(2) { animation-delay: .04s; }
.caixas > li:nth-child(3) { animation-delay: .08s; }
.caixas > li:nth-child(4) { animation-delay: .12s; }
.caixas > li:nth-child(n+5) { animation-delay: .16s; }
/* No celular a ilustração vai ao lado do texto, para caberem mais disciplinas na primeira tela. */
/* Em linha, a seta à direita faz o papel do "Ver aulas", e o título cabe numa linha só. */
.caixa.com-arte { flex-direction: row; align-items: stretch; gap: 0; padding: 0; overflow: hidden; }
.caixa.com-arte img { display: block; flex: none; width: 108px; height: auto; align-self: stretch; object-fit: cover; transition: transform .5s var(--saida); }
.caixa.com-arte:hover img { transform: scale(1.05); }
.caixa.com-arte .caixa-corpo { justify-content: center; padding: var(--e3) var(--e4); }
.caixa.com-arte .caixa-titulo { font-size: var(--t-leitura); text-wrap: wrap; }
.caixa.com-arte .caixa-acao { padding-top: 0; }
@media (min-width: 40rem) {
  .caixa.com-arte { flex-direction: column; }
  .caixa.com-arte img { width: 100%; aspect-ratio: 16 / 10; align-self: auto; }
  .caixa.com-arte .caixa-corpo { justify-content: flex-start; padding: var(--e4); }
  .caixa.com-arte .caixa-titulo { font-size: var(--t-titulo); text-wrap: balance; }
  .caixa.com-arte .caixa-acao { padding-top: var(--e2); }
}

/* Imagens de abertura e capa */
/* Faixa de abertura: verde cheio, texto claro e, ao fundo, as curvas em movimento. */
.abertura { position: relative; overflow: hidden; isolation: isolate; background: var(--faixa); color: var(--sobre-faixa); }
.abertura-texto { position: relative; display: grid; gap: var(--e3); max-width: calc(62rem + 2 * var(--margem)); margin-inline: auto; padding: clamp(var(--e6), 7vw, 5rem) var(--margem); }
.abertura .eye { color: var(--ouro-claro); }
.abertura h1 { max-width: 17ch; font-size: clamp(2.25rem, 1.5rem + 3.6vw, 3.75rem); }
.abertura-resumo { color: var(--faixa-suave); }
.abertura .ed { outline-color: var(--faixa-suave); }
.abertura .ed:hover { background: none; }
/* Ao fundo, os morros da Chapada desenhados traço a traço (src/nucleo/chapada.js). No celular, bem apagados atrás do texto. */
.abertura-arte { position: absolute; inset: 0; --arte-opacidade: .28; }
/* No desktop a arte fica na metade direita, fora do caminho do título. */
@media (min-width: 48rem) {
  .abertura-arte { left: 50%; --arte-opacidade: .75; }
  /* O desenho surge aos poucos à esquerda, sem corte reto. */
  .abertura-arte .chapada { -webkit-mask-image: linear-gradient(to right, transparent, #000 14%); mask-image: linear-gradient(to right, transparent, #000 14%); }
}
/* Traço claro sobre a faixa verde: o contorno mais forte, a rocha e a mata cada vez mais leves. */
.chapada { position: absolute; inset: 0; width: 100%; height: 100%; opacity: var(--arte-opacidade); }
.chapada path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.t-contorno { stroke: var(--sobre-faixa); stroke-width: 2.6; }
.t-cruz { stroke: var(--sobre-faixa); stroke-width: 2.2; }
.t-base, .t-quina { stroke: var(--faixa-suave); stroke-width: 1.8; }
.t-camada { stroke: var(--faixa-suave); stroke-width: 1.1; opacity: .7; }
.t-mata { stroke: var(--faixa-suave); stroke-width: 1.1; opacity: .5; }
.chapada-nome { position: absolute; right: 6%; bottom: var(--e4); font: 600 var(--t-meta)/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ouro-claro); opacity: var(--arte-opacidade); }
/* No celular a arte fica atrás do texto, bem apagada: o nome do morro só disputaria a leitura. */
@media (max-width: 47.99rem) {
  .chapada-nome { display: none; }
}
/* Abertura baixa: as caixas das disciplinas precisam aparecer sem rolar. */
/* A capa é uma ilustração pequena acima do título, alinhada à coluna. */
.capa { overflow: hidden; border-radius: var(--raio); background: var(--papel); }
.capa img { display: block; width: 100%; height: auto; aspect-ratio: 21 / 9; object-fit: cover; }
@media (max-width: 40rem) {
  main .col.larga { padding-block: var(--e5) var(--e6); }
}

/* Listas (modo de edição) */
.lista { border-top: 1px solid var(--linha); }
.lista > li { border-bottom: 1px solid var(--linha); }
.lista > li > a, .lista > li.editavel { display: flex; justify-content: space-between; align-items: baseline; gap: var(--e4); padding: var(--e3) 0; color: var(--tinta); text-decoration: none; }
.lista > li.editavel > a { flex: 1; padding: 0; }
.lista > li > a > span:first-child, .lista > li.editavel > span:first-child { font: 400 var(--t-leitura)/1.35 var(--serifa); min-width: 0; }
.lista > li > a > small { flex: none; text-align: right; }
.lista > li > a:hover > span:first-child { color: var(--verde); }

/* Avisos e ficha */
.avisos { display: grid; gap: var(--e2); }
.aviso { display: flex; justify-content: space-between; gap: var(--e3); background: var(--ouro-fundo); border-radius: var(--raio); padding: var(--e3) var(--e4); }
.aviso > div { min-width: 0; flex: 1; }
.aviso b { display: block; font: 600 var(--t-meta)/1.4 var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--ouro); }
.aviso .ate { display: block; font-size: var(--t-meta); margin-top: var(--e2); }
.ficha { border-top: 1px solid var(--linha); gap: 0; }
.ficha details { border-bottom: 1px solid var(--linha); }
.ficha summary { display: flex; justify-content: space-between; align-items: center; min-height: var(--toque); color: var(--suave); cursor: pointer; list-style: none; }
.ficha summary:hover { color: var(--tinta); }
.ficha summary::-webkit-details-marker { display: none; }
.ficha summary::after { content: '+'; color: var(--verde); }
.ficha details[open] summary::after { content: '–'; }
.ficha-corpo { display: grid; gap: .8em; padding-bottom: var(--e4); }

/* Módulos e aulas. Cada módulo é uma caixa: o aluno enxerga onde um termina e o outro começa. */
.col section.modulo { border: 1px solid var(--linha); border-radius: var(--raio); padding: var(--e4) var(--e4) var(--e1); scroll-margin-top: var(--e4); }
.col section.modulo:focus { outline: 0; border-color: var(--verde); }
.linha-titulo { display: flex; justify-content: space-between; align-items: baseline; gap: var(--e3); }
.linha-titulo h2 { min-width: 0; }
.num { display: inline-grid; place-items: center; width: 2rem; height: 2rem; margin-right: var(--e3); border-radius: 50%; background: var(--verde); color: var(--sobre-verde); font: 600 var(--t-meta)/1 var(--sans); letter-spacing: 0; vertical-align: .25em; }
.aulas { border-top: 1px solid var(--linha); }
.aula { display: flex; justify-content: space-between; gap: var(--e3); padding: var(--e4) 0; border-bottom: 1px solid var(--linha); }
.aula:last-child { border-bottom: 0; }
.aula > div { min-width: 0; flex: 1; }
.aula small { display: block; }
.aula-titulo { font: 400 var(--t-titulo)/1.3 var(--serifa); }
.aula-titulo a { color: var(--tinta); text-decoration: none; }
.aula-titulo a:hover { color: var(--verde); text-decoration: underline; }
.aula-titulo .abrir { font: 400 var(--t-meta) var(--sans); color: var(--verde); margin-left: var(--e3); }
.mats { display: flex; flex-wrap: wrap; gap: var(--e2); margin-top: var(--e3); }
/* Em leitura, cada aula é um cartão inteiro que leva à tela de estudo (vídeo e slides lado a lado). */
.aulas:has(.aula-leitura) { display: grid; gap: var(--e2); padding-block: var(--e3); }
.aula.aula-leitura { display: block; padding: 0; border: 0; }
.aula-cartao { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--e3) var(--e4); padding: var(--e3) var(--e4); border: 1px solid var(--linha); border-radius: var(--raio); background: var(--papel); color: var(--tinta); text-decoration: none; transition: border-color var(--rapido) var(--saida), background-color var(--rapido) var(--saida), transform var(--rapido) var(--saida); }
.aula-cartao:hover { border-color: var(--verde); background: color-mix(in srgb, var(--verde) 10%, var(--papel)); }
.aula-cartao:active { transform: scale(.99); }
.aula-num { display: grid; place-items: center; width: 2.25rem; height: 2.25rem; border-radius: 50%; border: 1px solid var(--linha); color: var(--suave); font: 600 var(--t-meta)/1 var(--sans); }
.aula-vista .aula-num { border-color: var(--verde); background: var(--verde); color: var(--sobre-verde); }
.aula-corpo { display: grid; gap: var(--e1); min-width: 0; }
.aula-cartao .aula-titulo { color: var(--tinta); }
.aula-cartao:hover .aula-titulo { color: var(--verde); }
.aula-materiais { display: flex; flex-wrap: wrap; gap: var(--e1) var(--e3); margin-top: var(--e1); }
.aula-tem { display: inline-flex; align-items: center; gap: var(--e1); font-size: var(--t-meta); color: var(--suave); }
.aula-tem .ic { width: 1rem; height: 1rem; color: var(--verde); }
.aula-ir { display: inline-flex; align-items: center; min-height: var(--toque); padding: 0 var(--e4); border-radius: 999px; background: var(--verde); color: var(--sobre-verde); font: 600 var(--t-meta)/1 var(--sans); white-space: nowrap; }
/* No celular o botão desce para baixo do texto, alinhado com o título. */
@media (max-width: 40rem) {
  .aula-cartao { grid-template-columns: auto minmax(0, 1fr); }
  .aula-ir { grid-column: 2; justify-self: start; min-height: 2.5rem; }
}
/* Botão grande no topo da disciplina: começar ou continuar de onde parou. */
.btn-estudar { display: inline-flex; align-items: center; gap: var(--e3); min-height: 3.5rem; padding: var(--e2) var(--e5) var(--e2) var(--e3); border-radius: 999px; background: var(--verde); color: var(--sobre-verde); text-decoration: none; transition: background-color var(--rapido) var(--saida), transform var(--rapido) var(--saida); }
.btn-estudar:hover { background: color-mix(in srgb, var(--verde) 86%, var(--tinta)); }
.btn-estudar:active { transform: scale(.98); }
.btn-estudar b { display: block; font: 600 var(--t-corpo)/1.25 var(--sans); }
.btn-estudar small { display: block; color: inherit; opacity: .8; font-size: var(--t-meta); }
.btn-estudar-play { flex: none; position: relative; width: 2.5rem; height: 2.5rem; border-radius: 50%; background: var(--sobre-verde); }
.btn-estudar-play::after { content: ''; position: absolute; left: 15px; top: 11px; border-left: 14px solid var(--verde); border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
.chip { display: inline-flex; align-items: center; gap: var(--e2); min-height: var(--toque); font: 600 var(--t-meta)/1.2 var(--sans); color: var(--verde); border: 1px solid var(--verde); border-radius: var(--raio); padding: 0 var(--e4); background: none; text-decoration: none; transition: background-color var(--rapido) var(--saida), color var(--rapido) var(--saida), transform var(--rapido) var(--saida); }
a.chip:hover, button.chip:hover { background: var(--verde); color: var(--sobre-verde); }
a.chip:active, button.chip:active { transform: scale(.97); }
.chip.novo { border-style: dashed; }
.chip > button { min-width: 2rem; min-height: 2rem; margin-right: calc(-1 * var(--e2)); border: 0; border-radius: var(--raio-p); background: none; color: inherit; }
.chip > button:hover { background: var(--papel); }

/* Aula: player e vizinhas */
.player { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; padding: 0; border-radius: var(--raio); overflow: hidden; background: var(--palco); color: var(--sobre-palco); text-decoration: none; }
.player img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .5; }
/* No player o fundo é sempre escuro, então a ilustração entra sempre invertida. */
.play { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: var(--sobre-palco); transition: transform var(--rapido) var(--saida); }
/* O triângulo fica 2 px à direita do centro geométrico: é onde ele parece centrado. */
.play::after { content: ''; position: absolute; left: 26px; top: 20px; border-left: 18px solid var(--palco); border-top: 12px solid transparent; border-bottom: 12px solid transparent; }
.player:hover .play { transform: scale(1.06); }
.legenda { position: absolute; left: 0; right: 0; bottom: var(--e4); text-align: center; font-size: var(--t-meta); font-weight: 600; }
.vizinhas { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e3); }
.vizinhas > :last-child { text-align: right; }
.vizinhas > :last-child .caixa-info, .vizinhas > :last-child .caixa-titulo { align-self: flex-end; }

/* Pesquisa e Sobre */
.projetos, .pubs, .orientacoes { display: grid; gap: var(--e4); }
.projetos > li, .pubs > li, .orientacoes > li, .tempo > li { display: flex; justify-content: space-between; gap: var(--e3); }
.projetos > li > div, .pubs > li > div, .orientacoes > li > div { min-width: 0; flex: 1; }
.ano { font: 600 var(--t-meta)/1.4 var(--sans); color: var(--suave); font-variant-numeric: tabular-nums; margin-top: var(--e3); }
.pubs { font-size: var(--t-meta); line-height: 1.6; }
.perfil { display: flex; flex-wrap: wrap; align-items: center; gap: var(--e5); }
/* O monograma também é um div: sem o :not, ele herdava o flex do bloco de texto e virava uma elipse. */
.perfil > div:not(.foto) { flex: 1 1 16rem; min-width: 0; display: grid; gap: var(--e2); }
.foto { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; flex: none; }
.foto.mono { display: grid; place-items: center; background: var(--papel); color: var(--verde); font: 400 2.25rem/1 var(--serifa); }
.tempo { display: grid; gap: var(--e5); }
.tempo > li { justify-content: flex-start; gap: var(--e4); }
.tempo > li > div { flex: 1; min-width: 0; }
.periodo { flex: 0 0 6.5rem; font-size: var(--t-meta); color: var(--suave); font-variant-numeric: tabular-nums; padding-top: .3em; }
.areas p { margin: 0; }
.contato { display: flex; flex-wrap: wrap; align-items: center; gap: var(--e3); }

/* Edição */
.btn-editar { position: fixed; right: var(--e4); bottom: calc(var(--e4) + env(safe-area-inset-bottom, 0px)); z-index: 5; min-height: var(--toque); background: var(--tinta); color: var(--fundo); border: 0; border-radius: 999px; padding: 0 var(--e5); font-weight: 600; transition: background-color var(--rapido) var(--saida), color var(--rapido) var(--saida); }
.btn-editar:hover { background: var(--verde); color: var(--sobre-verde); }
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--e2) var(--e4); padding: var(--e2) var(--margem); background: var(--tinta); color: var(--fundo); font-size: var(--t-meta); }
.grupo { display: flex; gap: var(--e2); }
.barra button, .acoes button, .contato button { min-height: 2.5rem; border: 1px solid currentColor; background: none; border-radius: var(--raio-p); padding: 0 var(--e4); font-size: var(--t-meta); font-weight: 600; transition: background-color var(--rapido) var(--saida); }
.barra button:hover:not(:disabled), .acoes button:hover:not(:disabled), .contato button:hover { background: color-mix(in srgb, currentColor 14%, transparent); }
.barra .pri { background: var(--fundo); color: var(--tinta); border-color: var(--fundo); }
.barra .pri:hover:not(:disabled) { background: var(--papel); }
.acoes .pri { background: var(--verde); color: var(--sobre-verde); border-color: var(--verde); }
.acoes .pri:hover:not(:disabled) { background: color-mix(in srgb, var(--verde) 86%, var(--tinta)); }
/* No celular, as ferramentas de edição sobem para uma linha própria: ao lado, espremiam o conteúdo e estouravam a tela. */
@media (max-width: 40rem) {
  .linha-titulo, .aula, .aviso, .tempo > li, .projetos > li, .pubs > li, .orientacoes > li, .lista > li.editavel { flex-wrap: wrap; }
  .tools { order: -1; flex: 1 0 100%; justify-content: flex-end; }
  .tempo > li > div { flex: 1 1 100%; }
  .periodo { flex: 0 0 auto; padding-top: 0; }
}
.ed { display: inline-block; min-width: 3ch; max-width: 100%; overflow-wrap: anywhere; outline: 1px dashed color-mix(in srgb, var(--verde) 55%, transparent); outline-offset: 3px; border-radius: 2px; }
.ed:hover { background: var(--papel); }
.ed:focus { outline: 2px solid var(--verde); background: none; }
.ed:empty::before { content: attr(data-vazio); color: var(--suave); }
.ed-bloco { display: block; white-space: pre-wrap; min-height: 4.5em; }
.tools { flex: none; display: flex; align-items: center; gap: var(--e1); font: 400 var(--t-meta) var(--sans); color: var(--suave); }
.tools > button { min-width: 2.25rem; min-height: 2.25rem; border: 0; background: none; border-radius: var(--raio-p); transition: background-color var(--rapido) var(--saida); }
.tools > button:hover:not(:disabled) { background: var(--papel); color: var(--tinta); }
.tools.conf { gap: var(--e2); }
.tools.conf > button { padding: 0 var(--e3); border: 1px solid currentColor; }
.add { justify-self: start; min-height: 2.5rem; border: 1px dashed var(--verde); background: none; color: var(--verde); border-radius: var(--raio-p); padding: 0 var(--e4); font: 600 var(--t-meta) var(--sans); transition: background-color var(--rapido) var(--saida); }
.add:hover { background: var(--papel); }
input[type="date"], select, .ano-in { min-height: 2.5rem; border: 1px solid var(--linha); border-radius: var(--raio-p); background: var(--fundo); padding: 0 var(--e2); font-size: var(--t-meta); }
.msg { position: fixed; left: 50%; bottom: calc(var(--e5) + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 6; width: max-content; max-width: min(92vw, 32rem); background: var(--tinta); color: var(--fundo); padding: var(--e3) var(--e4); border-radius: var(--raio-p); font-size: var(--t-meta); }

/* Formulário de material */
.folha-fundo { position: fixed; inset: 0; z-index: 10; background: var(--sombra); display: grid; place-items: end center; }
.folha { width: min(100%, 30rem); max-height: 92vh; overflow: auto; background: var(--fundo); border-radius: var(--raio) var(--raio) 0 0; padding: var(--e5) var(--margem) calc(var(--e5) + env(safe-area-inset-bottom, 0px)); display: grid; gap: var(--e3); }
.folha label, .folha legend { font: 600 var(--t-meta) var(--sans); color: var(--suave); }
.folha input[type="url"], .folha input[type="text"] { width: 100%; min-height: var(--toque); border: 1px solid var(--linha); border-radius: var(--raio-p); padding: 0 var(--e3); background: var(--fundo); }
.folha input[type="url"]:focus, .folha input[type="text"]:focus { border-color: var(--verde); }
.seg { display: flex; flex-wrap: wrap; gap: var(--e2); margin-top: var(--e2); }
.seg input { position: absolute; opacity: 0; }
.seg span { display: inline-flex; align-items: center; min-height: 2.5rem; border: 1px solid var(--linha); border-radius: 999px; padding: 0 var(--e4); font: 400 var(--t-meta) var(--sans); color: var(--tinta); cursor: pointer; transition: border-color var(--rapido) var(--saida), background-color var(--rapido) var(--saida); }
.seg span:hover { border-color: var(--verde); }
.seg input:checked + span { background: var(--verde); border-color: var(--verde); color: var(--sobre-verde); font-weight: 600; }
.seg input:focus-visible + span { outline: 2px solid var(--verde); outline-offset: 2px; }
.folha .drop { display: block; border: 1px dashed var(--verde); border-radius: var(--raio-p); padding: var(--e4); text-align: center; color: var(--verde); cursor: pointer; transition: background-color var(--rapido) var(--saida); }
.folha .drop:hover { background: var(--papel); }
.ok { color: var(--verde); font-size: var(--t-meta); }
.erro { color: var(--erro); font-size: var(--t-meta); }
.nota { font-size: var(--t-meta); }
.acoes { display: flex; justify-content: flex-end; gap: var(--e2); margin-top: var(--e2); }
@media (min-width: 40rem) {
  .folha-fundo { place-items: center; }
  .folha { border-radius: var(--raio); padding-inline: var(--e5); }
}

/* Busca: dentro da faixa de abertura, logo abaixo do resumo. */
.busca { max-width: 32rem; margin-top: var(--e2); }
.busca input { width: 100%; min-height: 3rem; border: 1px solid transparent; border-radius: 999px; padding: 0 var(--e5); background: var(--fundo); color: var(--tinta); font-size: var(--t-corpo); }
.busca input::placeholder { color: var(--suave); }
.busca input:focus { outline: 2px solid var(--ouro-claro); outline-offset: 2px; }
#resultados:empty { display: none; }
.resultados { display: grid; gap: var(--e4); }

/* Progresso do aluno */
.barra-progresso { display: block; height: 6px; border-radius: 999px; background: var(--linha); overflow: hidden; }
.barra-progresso > span { display: block; height: 100%; border-radius: inherit; background: var(--verde); }
.caixa-progresso { display: grid; gap: var(--e1); margin-top: var(--e2); font-size: var(--t-meta); color: var(--suave); }
.progresso-linha { display: grid; grid-template-columns: minmax(6rem, 12rem) auto; align-items: center; gap: var(--e3); font-size: var(--t-meta); color: var(--suave); }
.disciplina-acoes { display: flex; flex-wrap: wrap; align-items: center; gap: var(--e3); }
/* O progresso fica numa linha própria, embaixo dos botões. */
.disciplina-acoes .progresso-linha { flex-basis: 100%; }
.btn-duvida { display: inline-flex; align-items: center; min-height: var(--toque); padding: 0 var(--e5); border-radius: 999px; background: var(--verde); color: var(--sobre-verde); font-weight: 600; text-decoration: none; transition: background-color var(--rapido) var(--saida); }
.btn-duvida:hover { background: color-mix(in srgb, var(--verde) 86%, var(--tinta)); }
.caixa-continuar { border-color: var(--verde); background: var(--papel); }
.vista { margin-left: var(--e2); color: var(--verde); font-weight: 600; }
.aula-vista .aula-titulo a { color: var(--suave); }
.aula-resumo { margin-top: var(--e1); color: var(--suave); text-wrap: pretty; }
.btn-vista { justify-self: start; min-height: var(--toque); padding: 0 var(--e4); border: 1px solid var(--verde); border-radius: 999px; background: none; color: var(--verde); font-weight: 600; transition: background-color var(--rapido) var(--saida), color var(--rapido) var(--saida); }
.btn-vista:hover { background: var(--papel); }
.btn-vista.feita { background: var(--verde); color: var(--sobre-verde); }

/* Selo "Novo": o que o professor adicionou nos últimos 14 dias. */
.selo-novo { display: inline-block; margin-left: var(--e2); padding: 0 var(--e2); border-radius: 999px; background: var(--ouro-fundo); color: var(--ouro); font: 600 .75rem/1.6 var(--sans); letter-spacing: .04em; text-transform: uppercase; vertical-align: .1em; }
.caixa-info > .selo-novo:first-child { margin-left: 0; }
.chip .selo-novo { margin-left: 0; }

/* Cronograma */
.eventos { display: grid; border-top: 1px solid var(--linha); }
.evento { display: flex; flex-wrap: wrap; align-items: center; gap: var(--e2) var(--e3); padding: var(--e3) 0; border-bottom: 1px solid var(--linha); }
.evento.editavel { justify-content: space-between; }
.evento.editavel > div { display: flex; flex-wrap: wrap; align-items: center; gap: var(--e2); min-width: 0; flex: 1; }
.evento-data { flex: 0 0 5.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.evento-tipo { padding: 0 var(--e2); border-radius: 999px; background: var(--papel); color: var(--suave); font-size: var(--t-meta); font-weight: 600; }
.evento-tipo.tipo-prova { background: var(--ouro-fundo); color: var(--ouro); }
.evento-titulo { flex: 1 1 10rem; min-width: 0; }
.evento-agenda { display: inline-flex; align-items: center; min-height: var(--toque); font-size: var(--t-meta); font-weight: 600; text-decoration: none; }
.evento-agenda:hover { text-decoration: underline; }
.campo-linha { display: grid; gap: var(--e1); font: 600 var(--t-meta) var(--sans); color: var(--suave); }
.campo-linha input { min-height: var(--toque); border: 1px solid var(--linha); border-radius: var(--raio-p); padding: 0 var(--e3); background: var(--fundo); font-weight: 400; color: var(--tinta); }

/* Módulo: o que o aluno vai ver e o zip com tudo. */
.modulo-descricao { margin-top: var(--e3); font-size: var(--t-corpo); color: var(--suave); }
.baixar { display: inline-flex; align-items: center; gap: var(--e2); min-height: var(--toque); margin-bottom: var(--e3); font-size: var(--t-meta); font-weight: 600; text-decoration: none; }
.baixar:hover { text-decoration: underline; }
.baixar small { font-weight: 400; }

/* Aula: o que o aluno vai ver e a dica do professor */
.descricao-aula { display: grid; gap: var(--e2); }
.dica { display: grid; gap: var(--e2); padding: var(--e4); border-left: 3px solid var(--ouro-claro); border-radius: 0 var(--raio-p) var(--raio-p) 0; background: var(--ouro-fundo); }
.dica b { font: 600 var(--t-meta)/1.4 var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--ouro); }
.sobre-aula { display: grid; gap: var(--e3); }

/* Modo de estudo: vídeo e material lado a lado no desktop; no celular, um sobre o outro. */
.col.col-estudo { max-width: calc(80rem + 2 * var(--margem)); }
.col-estudo > :not(.estudo) { width: 100%; max-width: var(--largura); }
.estudo { display: grid; gap: var(--e4); align-items: start; }
.estudo-video { display: grid; gap: var(--e3); }
.estudo-material { display: grid; gap: var(--e2); min-width: 0; }
/* O leitor rola por dentro: a dica e as outras aulas continuam logo abaixo, sem uma apostila de 40 páginas no caminho. */
.leitor { height: min(78vh, 52rem); overflow: auto; overscroll-behavior: contain; display: grid; align-content: start; gap: var(--e3); padding: var(--e3); border-radius: var(--raio); background: var(--papel); }
.pagina-pdf { width: 100%; background: #fff; border-radius: 2px; box-shadow: 0 1px 3px rgba(20, 27, 23, .18); }
.pagina-pdf img { display: block; width: 100%; height: 100%; border-radius: inherit; }
.leitor-aviso { align-self: center; padding: var(--e6) var(--e4); text-align: center; color: var(--suave); }
.leitor-rodape { display: flex; flex-wrap: wrap; align-items: center; gap: var(--e2) var(--e4); font-size: var(--t-meta); }
/* Em tela cheia o leitor ocupa a tela toda, com as páginas centralizadas numa largura confortável de ler. */
.leitor:fullscreen { height: 100vh; padding: var(--e5); justify-items: center; }
.leitor:fullscreen .pagina-pdf { max-width: min(100%, 75rem); }
.abas { display: flex; flex-wrap: wrap; gap: var(--e2); }
.aba { display: inline-flex; align-items: center; gap: var(--e2); min-height: var(--toque); padding: 0 var(--e4); border: 1px solid var(--linha); border-radius: 999px; background: none; font-size: var(--t-meta); font-weight: 600; color: var(--suave); transition: border-color var(--rapido) var(--saida), background-color var(--rapido) var(--saida); }
.aba:hover { border-color: var(--verde); color: var(--tinta); }
.aba[aria-selected="true"] { background: var(--tinta); border-color: var(--tinta); color: var(--fundo); }
/* No celular, o vídeo que está tocando gruda no topo enquanto o aluno rola o material. */
@media (max-width: 63.99rem) {
  .estudo.tocando .estudo-video { position: sticky; top: 0; z-index: 2; padding-block: var(--e2); background: var(--fundo); }
  .estudo.tocando .aula-acoes { display: none; }
  .leitor { height: 70vh; }
}
@media (min-width: 64rem) {
  .estudo { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
  .estudo.so-video { grid-template-columns: minmax(0, var(--largura)); }
  .estudo-video { position: sticky; top: var(--e4); }
}

/* Ações da aula: marcar como vista e tirar dúvida, lado a lado. */
.aula-acoes { display: flex; flex-wrap: wrap; align-items: center; gap: var(--e2); }
.btn-duvida.leve { background: none; color: var(--verde); border: 1px solid var(--linha); }
.btn-duvida.leve:hover { background: var(--papel); border-color: var(--verde); }
/* Dúvida por e-mail: o botão abre, logo abaixo, a escolha de onde escrever. */
.duvida > summary { list-style: none; cursor: pointer; }
.duvida > summary::-webkit-details-marker { display: none; }
.duvida > summary::after { content: '▾'; margin-left: var(--e2); font-size: .8em; }
.duvida[open] { flex-basis: 100%; }
.duvida[open] > summary::after { content: '▴'; }
.duvida-painel { display: grid; gap: var(--e3); max-width: 40rem; margin-top: var(--e3); padding: var(--e4); border: 1px solid var(--linha); border-radius: var(--raio); background: var(--papel); font-size: var(--t-meta); }
.duvida-painel b { overflow-wrap: anywhere; }
.duvida-opcoes { display: flex; flex-wrap: wrap; gap: var(--e2); }
.duvida-opcoes .btn-abrir { background: var(--fundo); }
.copiar-manual { white-space: pre-wrap; user-select: all; padding: var(--e2) var(--e3); border: 1px dashed var(--linha); border-radius: var(--raio-p); }

/* Laboratório: cada material é um cartão que diz o que é, onde se usa e deixa espiar antes de baixar. */
.lab-grupo { scroll-margin-top: var(--e4); }
.lab-grupo:focus { outline: 0; }
.lab-grupo-descricao { max-width: 46rem; color: var(--suave); text-wrap: pretty; }
.lab-itens { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 27rem), 1fr)); gap: var(--e4); }
.lab-item { display: flex; flex-direction: column; gap: var(--e3); padding: var(--e4); border: 1px solid var(--linha); border-radius: var(--raio); background: var(--fundo); scroll-margin-top: var(--e6); transition: border-color var(--rapido) var(--saida), box-shadow .6s var(--saida); }
.lab-item:hover { border-color: color-mix(in srgb, var(--verde) 45%, var(--linha)); }
.lab-item:focus { outline: 0; }
/* Vindo de uma aula, o material procurado aparece marcado. */
.lab-item.destaque { border-color: var(--verde); box-shadow: 0 0 0 3px color-mix(in srgb, var(--verde) 22%, transparent); }
.lab-capa { position: relative; display: block; aspect-ratio: 16 / 9; max-height: 14rem; border-radius: var(--raio-p); background: var(--palco); overflow: hidden; }
.lab-capa img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.lab-tipo { display: flex; align-items: center; gap: var(--e2); }
.lab-tipo .ic { width: 1.25rem; height: 1.25rem; color: var(--verde); }
.lab-capa .play { width: 36px; height: 36px; margin: -18px 0 0 -18px; }
.lab-capa .play::after { left: 14px; top: 11px; border-left-width: 11px; border-top-width: 7px; border-bottom-width: 7px; }
.lab-corpo { display: flex; flex-direction: column; gap: var(--e2); min-width: 0; flex: 1; }
.lab-corpo h3 { font: 500 var(--t-titulo)/1.25 var(--serifa); text-wrap: balance; }
.lab-descricao { color: var(--suave); text-wrap: pretty; }
.lab-aulas { display: grid; gap: var(--e2); }
.lab-aulas > div { display: flex; flex-wrap: wrap; gap: var(--e2); }
.lab-aula { display: inline-grid; padding: var(--e1) var(--e3); border: 1px solid var(--linha); border-radius: var(--raio-p); color: var(--tinta); text-decoration: none; font-size: var(--t-meta); line-height: 1.35; transition: border-color var(--rapido) var(--saida), background-color var(--rapido) var(--saida); }
.lab-aula small { font-size: .75rem; }
.lab-aula:hover { border-color: var(--verde); background: var(--papel); }
.lab-acoes { display: flex; flex-wrap: wrap; gap: var(--e2); margin-top: auto; padding-top: var(--e2); }
.btn-previa, .btn-abrir { display: inline-flex; align-items: center; min-height: var(--toque); padding: 0 var(--e4); border-radius: 999px; font: 600 var(--t-meta)/1 var(--sans); text-decoration: none; transition: background-color var(--rapido) var(--saida), border-color var(--rapido) var(--saida); }
.btn-previa { border: 0; background: var(--verde); color: var(--sobre-verde); }
.btn-previa:hover { background: color-mix(in srgb, var(--verde) 86%, var(--tinta)); }
.btn-abrir { border: 1px solid var(--linha); color: var(--verde); }
.btn-abrir:hover { border-color: var(--verde); background: var(--papel); }
/* Edição do laboratório */
.lab-edicao-corpo { display: grid; gap: var(--e2); flex: 1; min-width: 0; }
.lab-relacoes { display: flex; flex-wrap: wrap; align-items: center; gap: var(--e2); }
.lab-relacoes small { flex-basis: 100%; }
.lab-relacoes select { max-width: 100%; }

/* Janela de prévia */
.previa { width: min(100% - 2 * var(--e4), 60rem); max-height: calc(100dvh - 2 * var(--e4)); padding: 0; border: 0; border-radius: var(--raio); background: var(--fundo); color: var(--tinta); box-shadow: 0 20px 60px var(--sombra); }
.previa[open] { display: flex; flex-direction: column; }
.previa::backdrop { background: var(--sombra); }
.previa-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--e3); padding: var(--e4) var(--e5); border-bottom: 1px solid var(--linha); }
.previa-topo h2 { font-size: var(--t-titulo); }
.previa-fechar { flex: none; width: var(--toque); height: var(--toque); border: 0; border-radius: 50%; background: var(--papel); font-size: 1.5rem; line-height: 1; }
.previa-fechar:hover { background: var(--linha); }
.previa-corpo { display: grid; gap: var(--e3); padding: var(--e4) var(--e5); overflow: auto; min-height: 0; }
.previa-corpo .leitor { height: min(70dvh, 48rem); }
.previa-rodape { display: flex; justify-content: flex-end; padding: var(--e3) var(--e5); border-top: 1px solid var(--linha); }
.previa-nota { color: var(--suave); font-size: var(--t-meta); }
.previa-tabela { overflow: auto; border: 1px solid var(--linha); border-radius: var(--raio-p); }
.previa-tabela table { border-collapse: collapse; font-size: var(--t-meta); white-space: nowrap; }
.previa-tabela td { padding: var(--e1) var(--e3); border: 1px solid var(--linha); }
.previa-tabela td.valor { text-align: right; font-variant-numeric: tabular-nums; }
.previa-tabela tr:first-child td { font-weight: 600; }
.previa-codigo { margin: 0; padding: var(--e4); overflow: auto; border-radius: var(--raio-p); background: var(--palco); color: var(--sobre-palco); font: .8125rem/1.55 ui-monospace, 'Cascadia Code', Consolas, monospace; }
.previa-pastas { display: grid; gap: var(--e2); }
.previa-pastas li { display: flex; align-items: center; gap: var(--e2); padding: var(--e2) var(--e3); border: 1px solid var(--linha); border-radius: var(--raio-p); }
@media (max-width: 40rem) {
  .previa-topo, .previa-corpo, .previa-rodape { padding-inline: var(--e4); }
}

/* QR codes para a sala: fundo branco sempre, para a câmera do celular ler sem erro. */
.qrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 13rem), 1fr)); gap: var(--e4); }
.qr-cartao { display: grid; gap: var(--e2); align-content: start; padding: var(--e4); border: 1px solid var(--linha); border-radius: var(--raio); }
.qr { aspect-ratio: 1; background: #fff; border-radius: var(--raio-p); }
.qr svg { display: block; width: 100%; height: 100%; }
.qr-cartao .caixa-titulo { font-size: var(--t-leitura); }
.qr-url { font-size: var(--t-meta); color: var(--suave); overflow-wrap: anywhere; }
.rodape-links { display: flex; flex-wrap: wrap; gap: var(--e4); }
@media print {
  .topo, .rodape, .btn-editar, .lead { display: none; }
  .qr-cartao { break-inside: avoid; }
}

/* Movimento */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style><div id="app"></div><script type="application/json" id="conteudo">{"site":{"titulo":"Finanças e Economia Gerencial","professor":"Prof. Dr. Antonio Francisco","instituicao":"Escola de Administração da UFBA","chamada":"Material de aula, pesquisa e textos em um só lugar.","laboratorio":"Planilhas, scripts e vídeos de apoio às disciplinas.","proposito":"Economia Gerencial é um campo de estudos que aplica técnicas e conceitos de microeconomia, teoria da decisão, pesquisa operacional, matemática, estatística, contabilidade, engenharia de produção e administração, para apoio na solução de problemas enfrentados pelas organizações. Em geral, esses problemas se associam às decisões sobre o que e como produzir, para quem produzir e qual a quantidade a ser produzida, considerando a escassez de recursos e o ambiente competitivo.\n\nFinanças é um campo de estudos dedicado a administração do dinheiro e dos investimentos, que utiliza técnicas e conceitos de matemática, estatística, economia, contabilidade e administração. Este sítio tem o propósito de promover educação e pesquisa em Finanças e Economia Gerencial.\n\nFoi criado para contribuir no desenvolvimento da capacidade analítica de estudantes e pessoas envolvidas no processo de decisão e formulação de estratégias para o crescimento sustentável."},"disciplinas":[{"id":"eg","nivel":"graduacao","nome":"Economia Gerencial","ficha":{"ementa":"","objetivos":"","avaliacao":"","bibliografia":""},"avisos":[],"modulos":[{"id":"eg-1","titulo":"Princípios de Microeconomia","aulas":[{"id":"eg-1-1","titulo":"Curva de Demanda","materiais":[{"id":"eg-1-1-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-1-aula-1-slides.pdf"},{"id":"eg-1-1-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/YHzoeE7-0sc"},{"id":"eg-1-1-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-1-aula-1-nota-de-aula.pdf"}],"descricao":"A relação entre preço e quantidade demandada, escrita como P = a − b × Q. Com o exemplo do sorvete, você vê como as demandas individuais se somam na demanda de mercado e também como funciona a curva de oferta.","dica":"Monte você mesmo a demanda de mercado do exemplo: some, a cada preço, as quantidades de cada consumidor. É o raciocínio que volta em todas as aulas seguintes."},{"id":"eg-1-2","titulo":"Custos da Firma","materiais":[{"id":"eg-1-2-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-1-aula-2-slides.pdf"},{"id":"eg-1-2-m2","tipo":"video","nome":"Vídeo da aula","url":"https://www.youtube.com/watch?v=X7ANRp74wfk"},{"id":"eg-1-2-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-1-aula-2-nota-de-aula.pdf"}],"descricao":"A função de produção Cobb-Douglas, o produto marginal e os rendimentos de escala (constantes, crescentes e decrescentes), chegando às curvas de custo da firma.","dica":"Teste a regra dos rendimentos de escala com números: dobre os dois insumos na Cobb-Douglas e veja se a produção dobra, mais que dobra ou menos."},{"id":"eg-1-3","titulo":"Maximizar Lucro","materiais":[{"id":"eg-1-3-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-1-aula-3-slides.pdf"},{"id":"eg-1-3-m2","tipo":"video","nome":"Vídeo da aula","url":"https://www.youtube.com/watch?v=_-iSF1mci-o"},{"id":"eg-1-3-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-1-aula-3-nota-de-aula.pdf"}],"descricao":"Receita total, receita marginal e a regra de ouro da firma: o lucro é máximo quando a receita marginal é igual ao custo marginal. A aula também separa lucro econômico de lucro contábil.","dica":"Derive RMg = a − 2bQ a partir de RT = aQ − bQ² e iguale ao custo marginal. Fazer a conta uma vez à mão fixa o procedimento."},{"id":"eg-1-4","titulo":"Exercícios","materiais":[{"id":"eg-1-4-m1","tipo":"video","nome":"Vídeo da aula","url":"https://www.youtube.com/watch?v=r3zU1NqWwG0"},{"id":"eg-1-4-m2","tipo":"planilha","nome":"Planilha","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-1-aula-4-planilha.xlsx"}],"descricao":"Exercícios resolvidos sobre demanda, custos e maximização de lucro, acompanhados de uma planilha.","dica":"Abra a planilha e tente resolver cada exercício antes de ver a resolução no vídeo. Pause e compare."},{"id":"eg-1-5","titulo":"Cesta de produtos (Pesq Oper)","materiais":[{"id":"eg-1-5-m1","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/UnDA482Imdo"},{"id":"eg-1-5-m2","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-1-aula-5-nota-de-aula.pdf"}],"descricao":"A maximização do lucro quando a empresa vende vários produtos, cada um com a própria curva de demanda e o próprio custo variável. A margem de contribuição de cada produto vira um problema de pesquisa operacional.","dica":"Comece com um produto só e confira se o resultado bate com a aula anterior; depois acrescente os outros. A lógica é a mesma, só a conta cresce."}],"descricao":"As bases de microeconomia que sustentam o resto da disciplina: como a demanda se forma, quanto custa produzir e como a empresa escolhe a quantidade que maximiza o lucro."},{"id":"eg-2","titulo":"Introdução à Teoria dos Jogos","aulas":[{"id":"eg-2-1","titulo":"Definições","materiais":[{"id":"eg-2-1-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-2-aula-1-slides.pdf"},{"id":"eg-2-1-m2","tipo":"video","nome":"Vídeo da aula","url":"https://www.youtube.com/watch?v=eJmceXNqAqc"},{"id":"eg-2-1-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-2-aula-1-nota-de-aula.pdf"}],"descricao":"O que é um jogo: empresas cujas decisões dependem umas das outras. A partir do exemplo da guerra entre Alfa e Beta, você vê os elementos de um jogo e como resolver jogos sequenciais.","dica":"Desenhe a árvore do jogo e resolva de trás para frente: comece pela última decisão e suba até a primeira."},{"id":"eg-2-2","titulo":"Jogo simultâneo","materiais":[{"id":"eg-2-2-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-2-aula-2-slides.pdf"},{"id":"eg-2-2-m2","tipo":"video","nome":"Vídeo da aula","url":"https://www.youtube.com/watch?v=ogPiOGDGc6E"},{"id":"eg-2-2-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-2-aula-2-nota-de-aula.pdf"}],"descricao":"Jogos em que as empresas decidem ao mesmo tempo, sem saber a escolha do rival. A aula define estratégia dominante e dominada e mostra como achar a melhor resposta de cada jogador.","dica":"Antes de procurar o equilíbrio, risque as estratégias dominadas da tabela. Muitas vezes o jogo fica pequeno o bastante para resolver de cabeça."},{"id":"eg-2-3","titulo":"Equilíbrio de Nash","materiais":[{"id":"eg-2-3-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-2-aula-3-slides.pdf"},{"id":"eg-2-3-m2","tipo":"video","nome":"Vídeo da aula","url":"https://www.youtube.com/watch?v=W6jKYW03XT0"},{"id":"eg-2-3-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-2-aula-3-nota-de-aula.pdf"}],"descricao":"O equilíbrio de Nash: a combinação em que cada empresa já está na melhor resposta ao que as outras fazem. O exemplo é a empresa ALFA decidindo se amplia a capacidade diante de uma concorrente estrangeira.","dica":"Use o procedimento da nota de aula: marque na tabela a melhor resposta de um jogador, depois a do outro. A célula com as duas marcas é o equilíbrio."}],"descricao":"Como decidir quando o resultado depende também do que o concorrente faz: jogos sequenciais, jogos simultâneos e o equilíbrio de Nash."},{"id":"eg-3","titulo":"Escala, escopo e fronteiras","aulas":[{"id":"eg-3-1","titulo":"Escala e escopo","materiais":[{"id":"eg-3-1-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-3-aula-1-slides.pdf"},{"id":"eg-3-1-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/1gzuvW4Z148"},{"id":"eg-3-1-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-3-aula-1-nota-de-aula.pdf"}],"descricao":"Economias e deseconomias de escala, a curva de custo total médio e os fatores que a movem, como o tamanho das instalações. A aula também trata das economias de escopo, quando produzir junto sai mais barato.","dica":"Pense numa empresa que você conhece e identifique onde ela ganha com escala e onde ganha com escopo. Exemplos próprios fixam melhor que os do livro."},{"id":"eg-3-2","titulo":"Fronteiras verticais","materiais":[{"id":"eg-3-2-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-3-aula-2-slides.pdf"},{"id":"eg-3-2-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/zm_l4MGgPUM"},{"id":"eg-3-2-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-3-aula-2-nota-de-aula.pdf"}],"descricao":"A cadeia vertical, da matéria-prima à venda, e a escolha entre fazer dentro de casa ou comprar de outras empresas. O exemplo é a cadeia do aço, da mineradora à siderúrgica.","dica":"Para cada etapa da cadeia do aço, pergunte: o que a siderúrgica ganha e o que perde ao integrar essa etapa? Essa lista de prós e contras é o centro da aula."},{"id":"eg-3-3","titulo":"Custo de transação","materiais":[{"id":"eg-3-3-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-3-aula-3-slides.pdf"},{"id":"eg-3-3-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/Ut6ytc4Havo"},{"id":"eg-3-3-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-3-aula-3-nota-de-aula.pdf"}],"descricao":"Por que os contratos são quase sempre incompletos (racionalidade limitada, desempenho difícil de medir e informação assimétrica) e como os custos de transação explicam a existência e o tamanho das empresas.","dica":"Relacione esta aula com a anterior: os custos de transação são o argumento que decide entre comprar no mercado e integrar verticalmente."}],"descricao":"Por que algumas empresas crescem, diversificam ou compram fornecedores, e quando vale mais a pena comprar no mercado: escala, escopo, integração vertical e custos de transação."},{"id":"eg-4","titulo":"Teoria da Agência","aulas":[{"id":"eg-4-1","titulo":"Problema de agência","materiais":[{"id":"eg-4-1-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-4-aula-1-slides.pdf"},{"id":"eg-4-1-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/4LvZb1Uf2bk"},{"id":"eg-4-1-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-4-aula-1-nota-de-aula.pdf"}],"descricao":"A relação entre o principal (o dono) e o agente (o administrador), por que os objetivos dos dois divergem e como monitoramento e incentivos por desempenho reduzem o problema.","dica":"Procure um caso real de conflito entre acionistas e executivos e identifique nele as duas condições do problema de agência: objetivos diferentes e informação difícil de observar."},{"id":"eg-4-2","titulo":"Governança","materiais":[{"id":"eg-4-2-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-4-aula-2-slides.pdf"},{"id":"eg-4-2-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/JR17gb-pSac"},{"id":"eg-4-2-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-4-aula-2-nota-de-aula.pdf"}],"descricao":"A estrutura de governança de uma empresa: Conselho de Administração, Conselho Fiscal, Comitê de Auditoria e diretoria, com o papel de cada um em riscos e controles.","dica":"Desenhe o organograma da governança, com quem se subordina a quem. Ajuda a não confundir Conselho Fiscal com Comitê de Auditoria."}],"descricao":"O conflito entre o dono (principal) e quem administra (agente), e os mecanismos de governança que reduzem esse problema."},{"id":"eg-5","titulo":"Estruturas de mercado","aulas":[{"id":"eg-5-1","titulo":"Concentração","materiais":[{"id":"eg-5-1-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-5-aula-1-slides.pdf"},{"id":"eg-5-1-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/8RhukeGLNXI"},{"id":"eg-5-1-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-5-aula-1-nota-de-aula.pdf"}],"descricao":"Como medir o grau de concentração de um mercado (quantas empresas dividem as vendas e de que forma) e o que isso indica sobre o tipo de concorrência.","dica":"Escolha um setor brasileiro, busque a participação de mercado das maiores empresas e calcule a concentração. O número ganha sentido quando vem de um caso real."},{"id":"eg-5-2","titulo":"Concorrência perfeita e monopólio","materiais":[{"id":"eg-5-2-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-5-aula-2-slides.pdf"},{"id":"eg-5-2-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/92WZxIMHzW8"},{"id":"eg-5-2-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-5-aula-2-nota-de-aula.pdf"}],"descricao":"Os dois extremos das estruturas de mercado. Na concorrência perfeita a empresa aceita o preço do mercado; no monopólio ela escolhe o preço. Nos dois casos, o lucro máximo está onde a receita marginal é igual ao custo marginal.","dica":"Resolva o mesmo mercado nas duas estruturas e compare preço e quantidade. A diferença é o custo do monopólio para o consumidor."},{"id":"eg-5-3","titulo":"Conc. monopolística","materiais":[{"id":"eg-5-3-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-5-aula-3-slides.pdf"},{"id":"eg-5-3-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/bQz6Tf8vlV8"},{"id":"eg-5-3-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-5-aula-3-nota-de-aula.pdf"}],"descricao":"A concorrência monopolística: muitas empresas com produtos diferenciados e sem barreiras de entrada. A aula distingue diferenciação vertical e horizontal e mostra o que acontece quando novas empresas entram.","dica":"Classifique produtos do dia a dia: a diferença está no desempenho (vertical) ou na preferência e na localização (horizontal)?"},{"id":"eg-5-4","titulo":"Oligopólio","materiais":[{"id":"eg-5-4-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-5-aula-4-slides.pdf"},{"id":"eg-5-4-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/Utba-t-Ma5Q"},{"id":"eg-5-4-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-5-aula-4-nota-de-aula.pdf"}],"descricao":"O oligopólio pelo modelo de Cournot: duas empresas escolhem quantidades, cada uma reagindo à outra, até chegar ao equilíbrio.","dica":"Escreva o lucro de cada empresa, derive e iguale a zero para achar as curvas de reação. O equilíbrio está onde as duas curvas se cruzam."},{"id":"eg-5-5","titulo":"Estudo de Caso Oligopólio - Chocolate","materiais":[{"id":"eg-5-5-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-5-aula-5-slides.pdf"},{"id":"eg-5-5-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/PW7bjT2w4Cg"}],"descricao":"Um estudo de caso com duas fábricas de chocolates finos que concorrem em preço, analisado pelo modelo de Bertrand com produtos diferenciados.","dica":"Compare com Cournot: aqui a variável de decisão é o preço, não a quantidade. Repare em como isso muda o resultado."}],"descricao":"Como o número de empresas e a diferenciação dos produtos mudam preços e lucros: da concorrência perfeita ao monopólio, passando pela concorrência monopolística e pelo oligopólio."},{"id":"eg-6","titulo":"Dinâmica da concorrência","aulas":[{"id":"eg-6-1","titulo":"Comprometimento","materiais":[{"id":"eg-6-1-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-6-aula-1-slides.pdf"},{"id":"eg-6-1-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/g4hI7Si89IU"},{"id":"eg-6-1-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-6-aula-1-nota-de-aula.pdf"}],"descricao":"O comprometimento estratégico: decisões difíceis de reverter, como ampliar a capacidade, que mudam o que o concorrente espera e podem dar vantagem a quem age primeiro.","dica":"Refaça o exemplo da aula duas vezes, com decisão simultânea e com a Empresa 1 decidindo primeiro, e compare os equilíbrios."},{"id":"eg-6-2","titulo":"Rivalidade","materiais":[{"id":"eg-6-2-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-6-aula-2-slides.pdf"},{"id":"eg-6-2-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/YucfitIUpNA"},{"id":"eg-6-2-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-6-aula-2-nota-de-aula.pdf"}],"descricao":"A dinâmica da rivalidade de preços: o que torna a concorrência mais intensa, por que alguns mercados evitam guerras de preço e como as empresas chegam ao equilíbrio de Cournot passo a passo.","dica":"Siga no gráfico das curvas de reação o caminho de Q₁⁰ até o equilíbrio. Desenhar os passos ajuda a entender a convergência."},{"id":"eg-6-3","titulo":"Análise do Setor","materiais":[{"id":"eg-6-3-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-6-aula-3-slides.pdf"},{"id":"eg-6-3-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/huPWY_XZpH4"},{"id":"eg-6-3-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-6-aula-3-nota-de-aula.pdf"}],"descricao":"A análise do setor pelas cinco forças competitivas de Porter: ameaça de entrada, rivalidade, substitutos e poder de negociação de fornecedores e compradores.","dica":"Aplique as cinco forças a um setor que você conhece e dê uma nota de intensidade a cada uma. É um bom exercício de fixação."}],"descricao":"A concorrência em movimento: compromissos estratégicos difíceis de reverter, guerras de preço e a análise do setor pelas cinco forças de Porter."},{"id":"eg-7","titulo":"Tópicos Especiais","aulas":[{"id":"eg-7-1","titulo":"Regulação","materiais":[{"id":"eg-7-1-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-7-aula-1-slides.pdf"}],"descricao":"Por que alguns mercados são regulados: monopólios naturais, indústrias de rede e externalidades, com exemplos como tarifas de telefonia e de eletricidade, vigilância sanitária e normas de segurança.","dica":"Para cada exemplo de regulação dos slides, identifique qual falha de mercado ele tenta corrigir."},{"id":"eg-7-2","titulo":"Inovação","materiais":[{"id":"eg-7-2-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-7-aula-2-slides.pdf"}],"descricao":"A economia da inovação contada pela história do pensamento econômico, de Adam Smith e David Ricardo em diante, e o papel da inovação no crescimento.","dica":"Monte uma linha do tempo com cada autor e a ideia central dele sobre crescimento e inovação."},{"id":"eg-7-3","titulo":"Sustentabilidade","materiais":[{"id":"eg-7-3-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/eg/modulo-7-aula-3-slides.pdf"}],"descricao":"Uma introdução à sustentabilidade como tema da economia gerencial.","dica":"Os slides são curtos: use-os como ponto de partida e anote as dúvidas para levar à aula."}],"descricao":"Temas que fecham a disciplina: regulação de mercados, economia da inovação e sustentabilidade."}],"cronograma":[],"duvidas":""},{"id":"fc1","nivel":"graduacao","nome":"Finanças Corporativas 1","ficha":{"ementa":"","objetivos":"","avaliacao":"","bibliografia":""},"avisos":[],"modulos":[{"id":"fc1-1","titulo":"Demonstrações Financeiras","aulas":[{"id":"fc1-1-1","titulo":"Introdução","materiais":[{"id":"fc1-1-1-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-1-aula-1-slides.pdf"},{"id":"fc1-1-1-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/YLb1WRCrkPg"},{"id":"fc1-1-1-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-1-aula-1-nota-de-aula.pdf"}],"descricao":"As três demonstrações principais: o balanço patrimonial (a fotografia da empresa), a DRE (o resultado do período) e a demonstração do fluxo de caixa (de onde vêm e para onde vão os recursos).","dica":"Baixe as demonstrações de uma empresa listada na bolsa e localize nelas cada conta vista na aula. Ler um balanço real é o melhor treino."},{"id":"fc1-1-2","titulo":"Análise horiz./vertical","materiais":[{"id":"fc1-1-2-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-1-aula-2-slides.pdf"},{"id":"fc1-1-2-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/zr2d8ZYuOD8"},{"id":"fc1-1-2-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-1-aula-2-nota-de-aula.pdf"}],"descricao":"Análise vertical (cada conta como percentual do total) e horizontal (a evolução de cada conta no tempo), aplicadas ao balanço e à DRE da Hipotética S/A.","dica":"Refaça na planilha o cálculo dos estoques da Hipotética S/A (16,3% em 20X3 e 13,6% em 20X2) e depois aplique o mesmo às outras contas."},{"id":"fc1-1-3","titulo":"Análise de índices","materiais":[{"id":"fc1-1-3-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-1-aula-3-slides.pdf"},{"id":"fc1-1-3-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/glY7z6vrEe0"},{"id":"fc1-1-3-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-1-aula-3-nota-de-aula.pdf"}],"descricao":"Os índices de liquidez, atividade, endividamento, rentabilidade e valor de mercado: o que cada um mede e como interpretar a alta ou a queda.","dica":"Para cada índice, escreva numa linha o que ele responde (por exemplo: \"a empresa paga as contas de curto prazo?\"). Decorar fórmula sem saber a pergunta não ajuda."},{"id":"fc1-1-4","titulo":"Ciclo financeiro","materiais":[{"id":"fc1-1-4-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-1-aula-4-slides.pdf"},{"id":"fc1-1-4-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/ip9P9FowcOk"},{"id":"fc1-1-4-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-1-aula-4-nota-de-aula.pdf"}],"descricao":"O capital de giro líquido e os ciclos operacional e financeiro: o tempo entre comprar a matéria-prima, pagar o fornecedor, vender e receber.","dica":"Desenhe a linha do tempo do ciclo com os prazos médios de estoque, de recebimento e de pagamento. O ciclo financeiro aparece sozinho no desenho."},{"id":"fc1-1-5","titulo":"Índices complementares","materiais":[{"id":"fc1-1-5-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-1-aula-5-slides.pdf"}],"descricao":"Indicadores que complementam a análise: margem de contribuição, markup, NOPAT, EVA, ROIC e a relação preço/lucro.","dica":"Calcule o NOPAT antes do EVA e do ROIC: os dois partem dele."},{"id":"fc1-1-6","titulo":"Laboratório Python","materiais":[{"id":"fc1-1-6-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-1-aula-6-slides.pdf"},{"id":"fc1-1-6-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/4aj8EJjh-qM"},{"id":"fc1-1-6-m3","tipo":"codigo","nome":"Notebook em Python","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-1-aula-6-codigo.ipynb"}],"descricao":"Laboratório em Python: uma rotina em Jupyter que calcula os índices financeiros da Klabin a partir das demonstrações publicadas pela empresa.","dica":"Siga o passo a passo dos slides com o notebook aberto. Depois troque a Klabin por outra empresa e compare os índices."}],"descricao":"Como ler uma empresa pelos números: balanço patrimonial, DRE e fluxo de caixa, análise horizontal e vertical, índices financeiros e ciclo financeiro, com um laboratório em Python usando dados da Klabin."},{"id":"fc1-2","titulo":"Planejamento de curto prazo","aulas":[{"id":"fc1-2-1","titulo":"Matemática financeira","materiais":[{"id":"fc1-2-1-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-2-aula-1-slides.pdf"},{"id":"fc1-2-1-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/AsSopK8T_QA"},{"id":"fc1-2-1-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-2-aula-1-nota-de-aula.pdf"}],"descricao":"O valor do dinheiro no tempo: por que R$ 50 hoje valem mais que R$ 50 daqui a seis meses, juros simples e compostos, valor presente e valor futuro.","dica":"Refaça a tabela de juros simples e compostos dos slides (R$ 1.000 a 10% ao ano por 4 anos) na calculadora ou na planilha."},{"id":"fc1-2-2","titulo":"Desconto e prazo","materiais":[{"id":"fc1-2-2-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-2-aula-2-slides.pdf"},{"id":"fc1-2-2-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/9BXctCeQIFI"},{"id":"fc1-2-2-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-2-aula-2-nota-de-aula.pdf"}],"descricao":"Política de prazos e descontos a clientes: quanto custa dar desconto para receber antes e como o prazo de pagamento mexe com as vendas e com o risco de crédito.","dica":"Resolva o exercício do desconto de 5% para pagamento em 10 dias trazendo tudo a valor presente antes de comparar."},{"id":"fc1-2-3","titulo":"Planos de curto prazo","materiais":[{"id":"fc1-2-3-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-2-aula-3-slides.pdf"},{"id":"fc1-2-3-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/XeKAqsGI_ds"},{"id":"fc1-2-3-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-2-aula-3-nota-de-aula.pdf"}],"descricao":"Como projetar o fluxo de caixa dos próximos meses separando recebimentos, pagamentos, investimentos e financiamentos, para prever sobras e faltas de caixa.","dica":"Monte a projeção do segundo trimestre do exemplo numa planilha, mês a mês. Errar a defasagem das vendas a prazo é o engano mais comum."},{"id":"fc1-2-4","titulo":"Capital de giro","materiais":[{"id":"fc1-2-4-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-2-aula-4-slides.pdf"},{"id":"fc1-2-4-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/6egGMQBgEJ8"},{"id":"fc1-2-4-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-2-aula-4-nota-de-aula.pdf"}],"descricao":"O capital de giro e o capital de giro líquido: a troca entre rentabilidade e risco de manter mais ou menos dinheiro aplicado no curto prazo.","dica":"Pense nos dois lados: mais capital de giro deixa a empresa mais segura e menos rentável. Explique essa troca com as suas palavras."}],"descricao":"As decisões financeiras do dia a dia: valor do dinheiro no tempo, política de prazos e descontos a clientes, projeção do fluxo de caixa e gestão do capital de giro."},{"id":"fc1-3","titulo":"Risco e retorno","aulas":[{"id":"fc1-3-1","titulo":"Métricas","materiais":[{"id":"fc1-3-1-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-3-aula-1-slides.pdf"},{"id":"fc1-3-1-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/NEr1_ud0cA4"},{"id":"fc1-3-1-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-3-aula-1-nota-de-aula.pdf"}],"descricao":"Como medir retorno e risco: retorno de uma ação com dividendos, capitalização contínua, retorno esperado versus histórico, variância e desvio padrão.","dica":"Calcule o retorno do exemplo (ação comprada a R$ 20, dividendo de R$ 0,50 e preço final de R$ 22) nas duas formas, discreta e contínua."},{"id":"fc1-3-2","titulo":"Modelo de fator único","materiais":[{"id":"fc1-3-2-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-3-aula-2-slides.pdf"},{"id":"fc1-3-2-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/fTwoT_5zm54"},{"id":"fc1-3-2-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-3-aula-2-nota-de-aula.pdf"}],"descricao":"Risco sistemático e não sistemático e o modelo de fator único, que usa um índice de mercado como o Ibovespa para explicar o retorno de cada ação pelo beta.","dica":"Baixe os preços de uma ação e do Ibovespa, calcule os retornos e faça a regressão na planilha. A inclinação é o beta."},{"id":"fc1-3-3","titulo":"O modelo CAPM","materiais":[{"id":"fc1-3-3-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-3-aula-3-slides.pdf"},{"id":"fc1-3-3-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/j_K-CAxBSFM"},{"id":"fc1-3-3-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-3-aula-3-nota-de-aula.pdf"}],"descricao":"O CAPM: as premissas do modelo, a ligação com a carteira de Markowitz e a relação entre beta e retorno esperado.","dica":"Leia as premissas com atenção. Boa parte das críticas ao CAPM nasce delas."},{"id":"fc1-3-4","titulo":"Risco de crédito","materiais":[{"id":"fc1-3-4-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-3-aula-4-slides.pdf"},{"id":"fc1-3-4-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/ByBrynaSjYk"},{"id":"fc1-3-4-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-3-aula-4-nota-de-aula.pdf"}],"descricao":"O risco de crédito: probabilidade de inadimplência, exposição e perda em caso de inadimplência, e a diferença entre perda esperada e perda inesperada.","dica":"Monte um exemplo com números simples: perda esperada = probabilidade × exposição × fração perdida."}],"descricao":"Como medir e precificar o risco: retorno e desvio padrão, risco sistemático e não sistemático, o modelo de fator único, o CAPM e o risco de crédito."},{"id":"fc1-4","titulo":"Instrumentos Básicos","aulas":[{"id":"fc1-4-1","titulo":"Ações","materiais":[{"id":"fc1-4-1-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-4-aula-1-slides.pdf"},{"id":"fc1-4-1-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/Q38EGdQGOlc"},{"id":"fc1-4-1-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-4-aula-1-nota-de-aula.pdf"}],"descricao":"As ações como capital próprio: ações ordinárias e preferenciais, companhia aberta e fechada, e a ordem dos direitos de acionistas e credores.","dica":"Monte uma tabela comparando ordinárias e preferenciais: voto, dividendos e prioridade na liquidação."},{"id":"fc1-4-2","titulo":"Títulos","materiais":[{"id":"fc1-4-2-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-4-aula-2-slides.pdf"},{"id":"fc1-4-2-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/KnGG7sYBjjo"},{"id":"fc1-4-2-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc1/modulo-4-aula-2-nota-de-aula.pdf"}],"descricao":"Os títulos de renda fixa: valor nominal, vencimento e cupons, títulos prefixados e pós-fixados, públicos e privados, com exemplos do Tesouro Nacional.","dica":"Abra o site do Tesouro Direto e identifique, entre os títulos à venda, quais são prefixados e quais são pós-fixados."}],"descricao":"Os instrumentos com que a empresa se financia: ações (capital próprio) e títulos de renda fixa (dívida)."}],"cronograma":[],"duvidas":""},{"id":"fc2","nivel":"graduacao","nome":"Finanças Corporativas 2","ficha":{"ementa":"","objetivos":"","avaliacao":"","bibliografia":""},"avisos":[],"modulos":[{"id":"fc2-1","titulo":"Avaliação de projetos","aulas":[{"id":"fc2-1-1","titulo":"Fluxo de caixa","materiais":[{"id":"fc2-1-1-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-1-aula-1-slides.pdf"},{"id":"fc2-1-1-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/YpIgVKs5Okg"},{"id":"fc2-1-1-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-1-aula-1-nota-de-aula.pdf"}],"descricao":"Como montar o fluxo de caixa de um projeto: investimento inicial, despesas pré-operacionais, previsão de receitas, custos e impostos, até chegar ao fluxo de caixa líquido.","dica":"Escolha um negócio simples (uma lanchonete, por exemplo) e liste tudo o que entra no investimento inicial. Depois projete três anos de entradas e saídas."},{"id":"fc2-1-2","titulo":"VPL e TIR","materiais":[{"id":"fc2-1-2-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-1-aula-2-slides.pdf"},{"id":"fc2-1-2-m2","tipo":"video","nome":"Vídeo da aula","url":"https://yo
