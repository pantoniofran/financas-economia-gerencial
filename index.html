utu.be/J2eGP8yMxZY"},{"id":"fc2-1-2-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-1-aula-2-nota-de-aula.pdf"}],"descricao":"O valor presente líquido e a taxa interna de retorno, os dois critérios centrais do orçamento de capital, com o exemplo do projeto de R$ 800 descontado a 12%.","dica":"Calcule o VPL do exemplo à mão e confira na planilha com as funções VPL e TIR. Repare que a função VPL do Excel não inclui o investimento da data zero."},{"id":"fc2-1-3","titulo":"Critérios adicionais","materiais":[{"id":"fc2-1-3-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-1-aula-3-slides.pdf"},{"id":"fc2-1-3-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/v-3X4OdZauk"},{"id":"fc2-1-3-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-1-aula-3-nota-de-aula.pdf"}],"descricao":"Critérios que complementam o VPL: o payback simples e o descontado, com as limitações de cada um.","dica":"Refaça a conta do payback de 7,5 anos do exemplo e depois a versão descontada. A diferença mostra o que o payback simples deixa de fora."}],"descricao":"Como decidir se um projeto vale o investimento: construção do fluxo de caixa, VPL, TIR, payback e outros critérios."},{"id":"fc2-2","titulo":"Custo de Capital","aulas":[{"id":"fc2-2-1","titulo":"Estrutura de capital","materiais":[{"id":"fc2-2-1-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-2-aula-1-slides.pdf"},{"id":"fc2-2-1-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/QhlG1oEWMi8"},{"id":"fc2-2-1-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-2-aula-1-nota-de-aula.pdf"}],"descricao":"A escolha entre capital próprio e de terceiros e as proposições de Modigliani e Miller: quando a estrutura de capital muda o valor da empresa e por que a dívida encarece o capital próprio.","dica":"Acompanhe o exemplo das empresas A (sem dívida) e B (com dívida) duas vezes, sem impostos e com impostos, e veja onde o valor muda."},{"id":"fc2-2-2","titulo":"CMPC","materiais":[{"id":"fc2-2-2-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-2-aula-2-slides.pdf"},{"id":"fc2-2-2-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/Lu0VJ4KomgE"},{"id":"fc2-2-2-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-2-aula-2-nota-de-aula.pdf"}],"descricao":"O custo médio ponderado de capital (CMPC): como estimar o custo do capital próprio (pelo modelo de dividendos ou pelo CAPM) e o custo da dívida depois dos impostos.","dica":"Monte o CMPC do exemplo numa planilha com cada peso e cada custo numa célula. Fica fácil ver o efeito de mudar a proporção de dívida."},{"id":"fc2-2-3","titulo":"Financiamento","materiais":[{"id":"fc2-2-3-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-2-aula-3-slides.pdf"},{"id":"fc2-2-3-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/x1kuVOo4L0Y"},{"id":"fc2-2-3-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-2-aula-3-nota-de-aula.pdf"}],"descricao":"Três formas de avaliar um projeto financiado com dívida (VPL sem financiamento mais benefício fiscal, fluxo do capital próprio e CMPC) e por que, na prática, elas nem sempre chegam ao mesmo número.","dica":"Resolva o caso simplificado com perpetuidades pelos três métodos. Chegar ao mesmo VPL é a prova de que as contas estão certas."}],"descricao":"Qual taxa usar para descontar o fluxo de caixa: estrutura de capital (Modigliani e Miller), custo médio ponderado de capital e o efeito do financiamento no valor do projeto."},{"id":"fc2-3","titulo":"Sistema Financeiro e Instrumentos","aulas":[{"id":"fc2-3-1","titulo":"Organização","materiais":[{"id":"fc2-3-1-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-3-aula-1-slides.pdf"},{"id":"fc2-3-1-m2","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-3-aula-1-nota-de-aula.pdf"}],"descricao":"Como o Sistema Financeiro Nacional se organiza: os órgãos normativos (CMN, CNSP, CNPC), os supervisores (Banco Central, CVM, SUSEP, PREVIC) e os operadores.","dica":"Desenhe o organograma do SFN em três camadas: quem faz as regras, quem fiscaliza e quem opera."},{"id":"fc2-3-2","titulo":"Instrumentos financeiros","materiais":[{"id":"fc2-3-2-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-3-aula-2-slides.pdf"},{"id":"fc2-3-2-m2","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-3-aula-2-nota-de-aula.pdf"}],"descricao":"A diferença legal entre valores mobiliários e não mobiliários e os principais instrumentos do mercado brasileiro, como debêntures, CRI, CRA, FII, LCI e LCA.","dica":"Faça uma tabela com cada sigla, quem emite, quem regula e se é valor mobiliário. As siglas se confundem fácil."},{"id":"fc2-3-3","titulo":"Termo/Futuros","materiais":[{"id":"fc2-3-3-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-3-aula-3-slides.pdf"},{"id":"fc2-3-3-m2","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-3-aula-3-nota-de-aula.pdf"}],"descricao":"O que são derivativos e como funcionam os contratos a termo e futuros, com o exemplo de uma produtora de soja que trava hoje o preço da venda futura.","dica":"Para cada exemplo, pergunte quem está protegido e contra qual risco. É o que diferencia hedge de especulação."},{"id":"fc2-3-4","titulo":"Swaps e Opções","materiais":[{"id":"fc2-3-4-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-3-aula-4-slides.pdf"},{"id":"fc2-3-4-m2","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fc2/modulo-3-aula-4-nota-de-aula.pdf"}],"descricao":"Swaps (trocas de fluxos de caixa, como dólar contra DI) e opções de compra e de venda: direitos, obrigações, prêmio e preço de exercício.","dica":"Desenhe o gráfico de lucro no vencimento de uma call e de uma put, comprada e vendida. Os quatro gráficos resumem a aula."}],"descricao":"Onde a empresa capta e protege recursos: a organização do Sistema Financeiro Nacional, os instrumentos financeiros e os derivativos (termo, futuros, swaps e opções)."}],"cronograma":[],"duvidas":""},{"id":"sem","nivel":"graduacao","nome":"Seminários em Finanças","ficha":{"ementa":"","objetivos":"","avaliacao":"","bibliografia":""},"avisos":[],"modulos":[{"id":"sem-1","titulo":"Avaliação clássica de projetos","aulas":[{"id":"sem-1-1","titulo":"Matemática Financeira","materiais":[{"id":"sem-1-1-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/sem/modulo-1-aula-1-slides.pdf"},{"id":"sem-1-1-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/SbVL8ZFnBso"},{"id":"sem-1-1-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/sem/modulo-1-aula-1-nota-de-aula.pdf"}],"descricao":"O valor do dinheiro no tempo: por que um valor hoje vale mais que o mesmo valor no futuro, juros compostos, valor presente e valor futuro.","dica" om perpetuidades pelos três métodos. Se o VPL não for igual nos três, há erro na conta."}],"descricao":"Qual taxa de desconto usar: estrutura de capital, risco sistemático, CAPM, custo médio ponderado de capital e o efeito do financiamento no valor do projeto."},{"id":"aep-3","titulo":"Abordagens alternativas","aulas":[{"id":"aep-3-1","titulo":"Árvore de decisão","materiais":[{"id":"aep-3-1-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/sem/modulo-2-aula-1-slides.pdf"},{"id":"aep-3-1-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/-AiFIq5Hhgg"},{"id":"aep-3-1-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/sem/modulo-2-aula-1-nota-de-aula.pdf"}],"descricao":"A árvore de decisão: alternativas, estados da natureza, probabilidades e valores esperados, aplicada a um problema de investimento.","dica":"Desenhe a árvore à mão antes de calcular e resolva da direita para a esquerda."},{"id":"aep-3-2","titulo":"Simulação de Monte Carlo","materiais":[{"id":"aep-3-2-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/sem/modulo-2-aula-2-slides.pdf"},{"id":"aep-3-2-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/n-dRyRxjcqk"},{"id":"aep-3-2-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/sem/modulo-2-aula-2-nota-de-aula.pdf"}],"descricao":"Processos estocásticos e simulação de Monte Carlo para gerar cenários e obter a distribuição do VPL de um projeto.","dica":"Comece simulando uma variável só e faça o histograma do VPL. Depois acrescente as outras incertezas."},{"id":"aep-3-3","titulo":"Opções reais","materiais":[{"id":"aep-3-3-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/sem/modulo-2-aula-3-slides.p  que o clima virou assunto de finanças: gases de efeito estufa e Acordo de Paris, ativos encalhados e como o sistema financeiro canaliza capital para projetos verdes."},{"id":"fv-2","titulo":"Desenvolvimento do mercado","aulas":[{"id":"fv-2-1","titulo":"Mercado de carbono","materiais":[{"id":"fv-2-1-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fv/modulo-2-aula-1-slides.pdf"},{"id":"fv-2-1-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/Ek0vsNxZgWo"},{"id":"fv-2-1-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fv/modulo-2-aula-1-nota-de-aula.pdf"}],"descricao":"O que é um crédito de carbono (uma tonelada de CO₂ equivalente evitada ou retirada), o sistema de cap and trade, os mercados voluntário e regulado e a origem no Protocolo de Kyoto e no Acordo de Paris.","dica":"Refaça o exemplo do cap and trade dos slides com as Empresas A e B e confira quem vende e quem compra créditos."},{"id":"fv-2-2","titulo":"RenovaBio","materiais":[{"id":"fv-2-2-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fv/modulo-2-aula-2-slides.pdf"},{"id":"fv-2-2-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/_ym7UCaPr24"},{"id":"fv-2-2-m3","tipo":"notas","nome":"Nota de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fv/modulo-2-aula-2-nota-de-aula.pdf"}],"descricao":"A Política Nacional de Biocombustíveis (RenovaBio, Lei nº 13.576/2017): objetivos, metas de redução de emissões, créditos de descarbonização (CBIOs) e certificação de biocombustíveis.","dica":"Compare o CBIO com o crédito de carbono da aula anterior: quem emite, quem é obrigado a comprar e o que cada um certifica."},{"id":"fv-2-3","titulo":"Green Bonds","materiais":[{"id":"fv-2-3-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fv/modulo-2-aula-3-slides.pdf"},{"id":"fv-2-3-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/yEzYGfC4Tjs"}],"descricao":"Os títulos sustentáveis (green, social, sustainability e sustainability-linked bonds): o que os diferencia e como financiam projetos ambientais e sociais.","dica":"Procure uma emissão real de green bond brasileira e identifique nela a categoria e o uso dos recursos."}],"descricao":"Os mercados e instrumentos que estão se formando: mercado de carbono, RenovaBio e créditos de descarbonização, e títulos verdes (green bonds)."},{"id":"fv-3","titulo":"Hidrogênio verde","aulas":[{"id":"fv-3-1","titulo":"Regulação H2","materiais":[{"id":"fv-3-1-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fv/modulo-3-aula-1-slides.pdf"},{"id":"fv-3-1-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/LJCmay7xs_8"}],"descricao":"A regulação que envolve o hidrogênio verde no Brasil, com o papel da ANEEL na geração, transmissão e comercialização de energia elétrica.","dica":"Monte um quadro com cada órgão citado e o que ele regula no caminho da energia renovável até o hidrogênio."},{"id":"fv-3-2","titulo":"Certificação","materiais":[{"id":"fv-3-2-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fv/modulo-3-aula-2-slides.pdf"},{"id":"fv-3-2-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/dryE6BCJn94"}],"descricao":"A certificação de projetos de hidrogênio verde e por que ela importa para acessar o mercado de títulos verdes.","dica":"Ligue esta aula à de green bonds: a certificação é o que permite ao projeto se apresentar como verde ao investidor."},{"id":"fv-3-3","titulo":"Financiamento","materiais":[{"id":"fv-3-3-m1","tipo":"slides","nome":"Slides da aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/fv/modulo-3-aula-3-slides.pdf"},{"id":"fv-3-3-m2","tipo":"video","nome":"Vídeo da aula","url":"https://youtu.be/6nsQfgfU1j8"}],"descricao":"Como estruturar o financiamento de projetos de hidrogênio verde: identificar os riscos e atribuí-los a quem tem melhores condições de assumi-los (patrocinadores, seguradoras, financiadores ou governo).","dica":"São 42 slides: faça uma matriz de riscos com o risco, quem assume e o instrumento usado, e preencha enquanto lê."}],"descricao":"O hidrogênio verde como caso aplicado: regulação no Brasil, certificação e a estruturação do financiamento desses projetos."}],"cronograma":[],"duvidas":""}],"laboratorio":[{"grupo":"Notas","itens":[{"id":"lab-1","tipo":"notas","nome":"Notas de aula","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/laboratorio/notas-de-aula.pdf","descricao":"O livro \"Finanças e Gestão Integrada de Riscos: anotações de aulas\" (2022), com 297 páginas e 14 capítulos: demonstrações financeiras, estatística aplicada, risco e retorno, taxa de juros, avaliação de projetos, processos estocásticos, derivativos, risco de mercado e de crédito, opções reais, project finance e gestão de riscos não financeiros."}],"descricao":"O livro de anotações de aula do professor, para consulta em todas as disciplinas."},{"grupo":"Planilhas","itens":[{"id":"lab-2","tipo":"planilha","nome":"Planilha de índices financeiros","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/laboratorio/planilha-de-indices-financeiros.xlsx","descricao":"Balanço e DRE da Hipotética S/A com todos os índices calculados (liquidez, atividade, endividamento, rentabilidade e valor de mercado). A aba de instruções explica como repetir a análise com uma empresa real, como Weg, Klabin, Suzano ou Magazine Luiza.","aulas":["fc1-1-2","fc1-1-3","fc1-1-5","pfc-1-2"]},{"id":"lab-3","tipo":"planilha","nome":"Planilha do modelo CAPM","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/laboratorio/planilha-do-modelo-capm.xls","descricao":"Preços mensais de seis ações brasileiras (Usiminas, Petrobras, Vale, Oi, Cesp e Itaú), com os retornos, a fronteira eficiente de Markowitz e um exercício de regressão do CAPM e do modelo de um fator contra o Ibovespa.","aulas":["fc1-3-2","fc1-3-3","pfc-3-2","aep-2-3","sem-3-2"]},{"id":"lab-4","tipo":"planilha","nome":"Planilha: opções reais em projeto solar","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/laboratorio/planilha-opcoes-reais-em-projeto-solar.xlsx","descricao":"Avaliação de uma usina solar de 10 MW: fluxo de caixa e VPL, simulação de cenários de produção e de preço da energia no mercado livre, e o valor da flexibilidade por opções reais (Black & Scholes).","aulas":["sem-2-2","sem-2-3","aep-3-2","aep-3-3"]},{"id":"lab-5","tipo":"planilha","nome":"Planilha: projeto de hidrogênio verde","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/laboratorio/planilha-projeto-de-hidrogenio-verde.xlsx","descricao":"A planilha do estudo de caso de hidrogênio verde: CAPEX e OPEX da planta, fluxo de caixa determinístico, simulação de cenários e avaliação por opções reais (binomial e Black & Scholes), com premissas de financiamento do BNDES.","aulas":["aep-4-1","fv-3-3"]},{"id":"lab-6","tipo":"planilha","nome":"Planilha: maximização com três produtos","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/laboratorio/planilha-maximizacao-com-tres-produtos.xlsx","descricao":"Maximização do lucro de uma empresa com três produtos, cada um com a sua curva de demanda e o seu custo variável, sujeita a um orçamento máximo. É o exemplo da aula de cesta de produtos, resolvido com o Solver.","aulas":["eg-1-5"]}],"descricao":"Modelos em Excel com os exemplos das aulas montados. Abra, confira as contas e troque os números para ver o que muda."},{"grupo":"R e código","itens":[{"id":"lab-7","tipo":"video","nome":"Vídeo: instalação do R","url":"https://youtu.be/Af1-qAA4obQ","descricao":"Passo a passo para instalar o R e o RStudio no computador. Comece por aqui antes dos outros materiais em R.","aulas":["sem-1-5"]},{"id":"lab-8","tipo":"video","nome":"Vídeo: introdução ao R","url":"https://youtu.be/Su1A-nCVIGg","descricao":"Primeiros passos no R: variáveis, data frames, bibliotecas, gráficos e como editar e rodar um script.","aulas":["sem-1-5"]},{"id":"lab-9","tipo":"video","nome":"Vídeo: cálculo de retornos no R","url":"https://youtu.be/d50KqrSEjoA","descricao":"Como baixar os preços de ações no R e calcular os retornos, o mesmo cálculo da aula de métricas de risco e retorno.","aulas":["fc1-3-1","pfc-3-1","aep-2-2"]},{"id":"lab-10","tipo":"codigo","nome":"Script em R: dados do Banco Central","url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/laboratorio/script-em-r-dados-do-banco-central.txt","descricao":"Script que baixa da API do Banco Central as séries do IPCA, do dólar (PTAX) e da Selic, junta tudo numa tabela e ajusta uma regressão do IPCA contra câmbio e juros. Antes de rodar, troque o caminho do arquivo na linha do write.csv por uma pasta do seu computador."},{"id":"lab-11","tipo":"codigo","nome":"Repositório no GitHub: Seminários em Finanças","url":"https://github.com/pantoniofran/GitSeminarioFinancas.git","descricao":"Repositório do professor com os notebooks em Python da disciplina de Seminários: análise tradicional de projetos, índices das demonstrações financeiras, otimização de carteiras, projeto solar, risco de mercado e valuation.","aulas":["sem-3-1","sem-3-2","sem-3-3"]}],"descricao":"Para quem quer automatizar as análises: instalação do R, scripts prontos e os notebooks da disciplina de Seminários."},{"grupo":"Vídeos","itens":[{"id":"lab-12","tipo":"video","nome":"Vídeo: maximização de lucro","url":"https://youtu.be/doa8B8igc4c","descricao":"Exemplo aplicado numa hamburgueria: curva de demanda, estrutura de custos, receita total e o ponto de lucro máximo.","aulas":["eg-1-3"]},{"id":"lab-13","tipo":"video","nome":"Vídeo: programação linear","url":"https://youtu.be/5DjOnAk-06E","descricao":"Introdução à programação linear e à otimização, o conceito de preço sombra e a solução com o Solver do Excel.","aulas":["eg-1-5"]},{"id":"lab-14","tipo":"video","nome":"Vídeo: critérios de decisão","url":"https://youtu.be/Crbl1Qikqlc","descricao":"Os critérios para decidir entre alternativas sob incerteza: minimax, maximax, mínimo arrependimento, maior probabilidade e valor esperado.","aulas":["sem-2-1","aep-3-1"]},{"id":"lab-15","tipo":"video","nome":"Vídeo: árvore de decisão","url":"https://youtu.be/-AiFIq5Hhgg","descricao":"A árvore de decisão aplicada à decisão de investimento em projetos.","aulas":["sem-2-1","aep-3-1"]}],"descricao":"Vídeos curtos com exemplos resolvidos passo a passo."}],"textos":[{"id":"financas-verdes","titulo":"Finanças Verdes","data":"2020-09-27","resumo":"Como financiar projetos que mitigam os efeitos da ação humana no meio ambiente.","corpo":"Finanças Verdes é um campo de pesquisa que ganha espaço entre acadêmicos, e envolve profissionais do setor financeiro, do setor real da economia, do Estado e da sociedade de maneira geral. O objetivo principal, mas não único, é evitar que a temperatura da Terra suba mais de 2º C, quando comparada às temperaturas do período pré-industrial. Para que isso ocorra, esforços devem ser empreendidos para que projetos ambientalmente mais sustentáveis sejam executados.\n\nDois riscos principais estão presentes: os físicos, como secas, derretimento das calotas polares e elevação dos níveis dos oceanos; e os riscos de transição, que envolvem os efeitos da acomodação econômica à nova realidade.\n\nO financiamento de projetos que envolvem redução de emissão de gases de efeito estufa, como o CO2, está na pauta das discussões. As ferramentas à disposição envolvem redução de carga tributária para setores como indústria eólica e solar, criação de um mercado de carbono e incentivo à emissão de títulos verdes para captação de recursos financeiros destinados a projetos de tecnologia limpa.\n\nDesafios\n\nDentre os vários desafios, podemos destacar a dificuldade em se estabelecer uma tipologia para projetos que são considerados verdes, encontrar uma metodologia aceita de forma abrangente para associar a emissão ao seu emissor (quem gera e quem consome), quantificar as emissões e encontrar o preço justo para a emissão. As diversas escolhas terão implicações econômicas, onde alguns setores deverão ser penalizados e outros estimulados. O balanço adequado das consequências das decisões deve ser bem avaliado, para que o financiamento verde se dê de forma equilibrada, dentro do possível, uma vez que o planeta já está dando sinais de que a intervenção humana deve ser melhor planejada."},{"id":"integrar-ou-nao-verticalmente","titulo":"Integrar ou não verticalmente – Petrobras, Ferbasa e Hapvida","data":"2020-09-26","resumo":"A decisão que exige visão estratégica.","corpo":"Uma cadeia de produção tem diferentes etapas. Na indústria do petróleo, a cadeia de produção envolve a extração, o refino e a distribuição dos combustíveis. Na indústria siderúrgica e metalúrgica, temos a exploração do minério a montante da cadeia de produção. Nos serviços de saúde, temos os hospitais, as clínicas que fazem exames e os planos de saúde.\n\nA integração vertical é uma decisão que envolve colocar vantagens e desvantagens em uma balança e escolher o arranjo mais adequado.\n\nHapvida\n\nA rede Hapvida adota a estratégia de integrar os serviços, o que permite obter os lucros ao longo da cadeia de produção de serviços de saúde. Recentemente, a empresa adquiriu planos de saúde e hospitais em Goiás, Minas Gerais e São Paulo. Nas diversas entrevistas que se sucedem às aquisições do grupo, são destacados os fatores de padronização dos serviços, integração de sistemas de informação e ganhos de escala.\n\nFerbasa\n\nA Ferbasa é uma empresa sediada em Pojuca que atua em atividades de metalurgia, mineração, energia eólica e de plantios de florestas. A integração vertical entre a mineração e a metalurgia é clara, pois as ligas produzidas pela empresa têm como matéria prima o minério de ferro. As florestas renováveis de eucalipto são usadas como matéria prima para produção de biorredutor que também é matéria prima para a produção de ferroligas. Como a empresa é intensiva em energia, o parque eólico reduz a exposição da companhia à variação de preços de energia elétrica.\n\nPetrobras\n\nVejamos o caso da Petrobras que conduz plano de venda de refinarias. Nesse caso, temos uma empresa decidindo em reduzir sua integração vertical. A lógica nesse último caso deve ser a diferença entre margens de lucro do negócio de exploração e do negócio de refino. Como a empresa necessita de grandes investimentos para explorar o pré-sal, há uma pressão pela venda de ativos para financiar sua expansão de produção de óleo.\n\nA decisão\n\nNos três casos, a integração vertical (ou não) é uma decisão estratégica, já que afeta a sustentabilidade econômica do negócio no longo prazo, envolvendo planejamento detalhado e esforço da companhia na realização de seus planos. A integração vertical permite que a empresa reduza riscos na produção e incorpore os lucros na cadeia de produção. No entanto, a integração vertical é uma tarefa que exige muito esforço para a gestão dos diferentes negócios, o que pode eventualmente trazer ineficiências se algum deles for deixado de lado por ter menor prioridade estratégica."},{"id":"porto-sul-e-fiol","titulo":"Porto Sul (Ilhéus) e a Ferrovia de Integração Oeste-Leste","data":"2020-05-31","resumo":"","corpo":"Estamos em 2020 e os projetos da ferrovia de integração oeste-leste (FIOL) e do porto de Ilhéus ainda estão em em andamento! Em 2009, escrevi um artigo em co-autoria com o professor Sandro Cabral sobre alternativas de investimentos na construção da FIOL. Dentre as escolhas estratégicas para o empreendimento, discutimos a possibilidade de se realizar o primeiro trecho da ferrovia com interligação a outra já existente, como alternativa inicial à ligação direta a Ilhéus, que foi a opção escolhida. O artigo foi publicado pela revista BASE, da Unisinos. Em 2013, publicamos juntos um texto no Jornal Correio da Bahia: https://www.correio24horas.com.br/noticia/nid/escolhas-estrategicas-para-uma-ferrovia-e-a-universidade/, que trazia essa discussão do artigo para a mídia.\n\nEscolhas estratégicas - O que havíamos concluído já em 2009\n\n...Nesse caso, o trecho entre Brumado e Ilhéus seria construído posteriormente, e seria resultado de opções estratégicas associadas às incertezas e riscos do negócio, como por exemplo, fatores políticos, ambientais e decorrentes da dinâmica de interação estratégica entre os entes empresariais e governamentais envolvidos. Diferentemente do projeto em curso, nossas análises à época indicaram a superioridade da segunda alternativa, em que pese a necessidade de resolução de questões ligadas aos direitos de passagem junto a concessionária do trecho atual e de eventuais modificações físicas no trajeto já existente.\n\nPois é, as várias incertezas que envolvem o projeto conduziram a muitas idas e vindas de licenças ambientais, discussões sobre os potenciais impactos ambientais no distrito de Aritaguá, na cidade de Ilhéus, e os impactos sociais do projeto, principalmente no que diz respeito ao negócio do turismo e do plantio do cacau. Uma discussão interessante pode ser vista no link: https://www.nossailheus.org.br/construcao-do-porto-sul-na-bahia-poe-ativistas-contra-governo/.\n\nAgora em 2020, foi assinado o acordo para gestão dos recursos socioambientais do Porto Sul, a Bahia Mineração (BAMIN) assinou a ordem de serviço para início das obras do Porto Sul, e o governo do Estado da Bahia estuda emitir título verde para a obra em construção da FIOL (ver http://www.ilheus24h.com.br/v1/category/porto-sul/).\n\nQual a causa de tanta demora?\n\nO projeto sem dúvida é complexo. No entanto, é difícil entender porque projetos dessa importância econômica e social levam tanto tempo para serem implementados. Tudo indica que o problema desse projeto iniciou ainda em sua fase de concepção. As ideias talvez não tenham sido corretamente discutidas e avaliadas antes de ter se dado o início às etapas seguintes do projeto.\n\nGoverno, instituições, empresários, sociedade civil e Universidade\n\nPrecisamos discutir projetos de uma maneira coletiva e eficiente, para evitar a sensação de que não conseguimos realizar as coisas com eficácia.\n\nA discussão coletiva não pode ser feita sob a lógica simplificadora de que uns estão certos e outros errados. O processo de discussão coletiva deve levar as pessoas a um consenso de tal forma que as coisas avancem de maneira positiva para todos.\n\nOs mecanismos de participação no processo decisório devem ser estimulados de tal forma que as partes interessadas não sejam apenas ouvidas! As ideias precisam ser bem estudadas e discutidas. Governo, instituições, empresários, universidade e sociedade civil em geral precisam discutir juntos e de maneira eficiente questões da importância de um projeto dessa natureza, para evitar judicializações que prejudicam todo o processo."}],"pesquisa":{"linhas":"As pesquisas desenvolvidas estão no campo das Finanças e Economia Gerencial e se concentram em análise de investimentos, gestão de riscos, finanças verdes e governança corporativa.\n\nOs projetos de pesquisa estão em sintonia com as linhas definidas no grupo de pesquisa cadastrado no CNPq.\n\nOs projetos de Finanças Verdes buscam identificar alternativas de financiamento e de análise de carteiras com ativos relacionados à sustentabilidade.\n\nOs projetos em parceria com a Deten Química tiveram entre seus objetivos o desenvolvimento e aplicação de ferramentas de gestão de riscos financeiros como apoio ao processo de decisão da empresa. Um deles contou com apoio do CNPq e da Fieb, no âmbito do projeto Inovatec.","grupo":{"nome":"Grupo de Pesquisa em Finanças - UFBA","url":"http://dgp.cnpq  Engineering of the New York University (2016).\n\nManagerial Economics. This is an undergraduate course for students in the fifth semester of Business Administration. In this course I present introductory concepts of microeconomics, game theory, market structure, agency theory and competitive strategy.\n\nCorporate Finance 1. This is an undergraduate course for students in the fourth semester of Business Administration. In this course I present introductory concepts balance sheet, income statement, financial analysis, risk and return, financial products and CAPM.\n\nCorporate Finance 2. In this course I teach the concepts of cash flow forecast, net present value, internal rate of return, payback, cost of capital, and capital structure.\n\nGreen Finance. This is a graduate course. I present in this course concepts of global warming, physical and transition risks, climate related financial disclosure, green bonds and clean energy finance.\n\nInvestment analysis. This is an advanced course for graduate students. The main concepts are projects evaluation, stochastic process, real options and risk management."}}</script><script type="application/json" id="config">{"ambiente":"local","ensaio":false,"titulo":"Finanças e Economia Gerencial","fontes":"https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400..600&family=Literata:opsz,wght@7..72,400..500&display=swap","midia":{"poster":"midia/poster.webp","hero":"midia/hero.mp4","capa-eg":"midia/capa-eg.webp","capa-fc1":"midia/capa-fc1.webp","capa-fc2":"midia/capa-fc2.webp","capa-sem":"midia/capa-sem.webp","capa-pfc":"midia/capa-pfc.webp","capa-aep":"midia/capa-aep.webp","capa-fv":"midia/capa-fv.webp","foto":"midia/foto.webp"},"siteUrl":"https://pantoniofran.github.io/financas-economia-gerencial/","zips":{"eg-1":{"url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/zip/eg-modulo-1.zip","tamanho":"1,8 MB"},"eg-2":{"url":"https://pantoniofran.github.io/financas-economia-gerencial/arquivos/zip/eg-mo
